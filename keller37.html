<script id="game-slots">
/* ================= SLOTS ================= */
const Slots = {
  root: null,
  spinning: false,
  gen: 0,
  alive(gen) { return !!this.root && this.gen === gen; },
  cell() { const c = qs('.cell', this.root); return c ? c.offsetHeight : 90; },
  buildStrips() {
    qsa('.strip', this.root).forEach((strip) => {
      strip.innerHTML = '';
      for (let r = 0; r < 3; r++) for (const s of Rules.SYMBOLS) strip.append(h('div', { class: 'cell' }, s));
    });
  },
  setReel(i, sym, animate) {
    const strip = qs(`#reel${i} .strip`, this.root);
    if (!strip) return;
    const idx = Rules.SYMBOLS.indexOf(sym);
    strip.classList.remove('spinning');
    strip.style.transition = animate ? 'transform .45s cubic-bezier(.2,1.5,.4,1)' : 'none';
    strip.style.transform = `translateY(${-(6 + idx) * this.cell()}px)`;
  },
  async spin() {
    if (this.spinning || !this.root) return;
    const bet = Game.readBet('slotBet');
    if (!Game.beginSpin(bet)) return;
    const run = Game.run;
    const gen = this.gen;
    this.spinning = true;
    try {
      qs('#btnSpin', this.root).disabled = true;
      const lever = qs('#lever', this.root);
      lever.classList.add('pulled');
      setTimeout(() => lever.classList.remove('pulled'), 500);
      qs('#slotStatus', this.root).textContent = 'Walzen laufen…';
      qsa('.reel-win', this.root).forEach((r) => r.classList.remove('locked', 'hit'));
      let res = Rules.slotRoll(Math.random);
      res = Rules.slotLuckOverride(res, Rules.luck(State.s), Math.random);
      qsa('.strip', this.root).forEach((s, k) => { s.style.transition = 'none'; s.style.transform = 'translateY(0)'; s.style.animationDelay = `${-k * 0.13}s`; void s.offsetHeight; s.classList.add('spinning'); });
      SFX.loop('reelSpin', 120);
      [800, 1400, 2000].forEach((ms, i) => setTimeout(() => {
        if (!this.alive(gen)) return;
        this.setReel(i + 1, res[i], true);
        qs(`#reel${i + 1}`, this.root).classList.add('locked');
        SFX.play('reelStop');
        if (i === 2) SFX.stop('reelSpin');
      }, ms));
      await wait(2450);
      SFX.stop('reelSpin');
      const m = Rules.slotMultiplier(...res);
      const delta = Rules.slotDelta(bet, m);
      if (this.alive(gen)) {
        const stat = qs('#slotStatus', this.root);
        if (m > 0) {
          stat.innerHTML = `<span class="win">${String(m).replace('.', ',')}× · Auszahlung ${UI.fmt(Math.round(bet * m))} (${delta >= 0 ? '+' : '−'}${UI.fmt(Math.abs(delta))})</span>`;
          qsa('.reel-win', this.root).forEach((r) => r.classList.add('hit'));
          if (m >= 25) this.jackpot(m === 50 ? 'JACKPOT' : 'DIAMANTEN');
        } else {
          stat.innerHTML = `<span class="loss">Niete · −${UI.fmt(bet)}</span>`;
        }
      }
      await Bus.emit('slots:result', { res, m, bet });
      await Game.settle(delta, { from: this.alive(gen) ? qs('.slot-machine', this.root) : null, game: 'slots', bet, run });
    } finally {
      SFX.stop('reelSpin');
      if (this.gen === gen) {
        this.spinning = false;
        qs('#btnSpin', this.root).disabled = false;
      }
    }
  },
  jackpot(label) {
    const machine = qs('.slot-machine', this.root);
    const sign = h('div', { class: 'jackpot neon', style: '--neon: var(--neon-amber)' }, label);
    machine.append(sign);
    setTimeout(() => sign.remove(), 2500);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (let i = 0; i < 40; i++) {
      const c = h('span', { class: 'coin-p', style: `left:${rand(5, 90)}%; top:${rand(0, 30)}%; animation-delay:${rand(0, 0.8)}s` }, pick(['🪙', '💰', '💶']));
      machine.append(c);
      setTimeout(() => c.remove(), 2600);
    }
  },
  onKey(e) { if (e.code === 'Space' && qs('#cutscene').hidden && !e.repeat) { e.preventDefault(); Slots.spin(); } },
};

UI.register('slots', {
  template: 'tpl-slots',
  mount(root) {
    Slots.gen++;
    Slots.root = root;
    Slots.buildStrips();
    ['🍒', '7️⃣', '💎'].forEach((s, i) => Slots.setReel(i + 1, s, false));
    Game.bindBet(root, 'slotBet');
    qs('#btnSpin', root).addEventListener('click', () => Slots.spin());
    qs('#lever', root).addEventListener('click', () => Slots.spin());
    document.addEventListener('keydown', Slots.onKey);
  },
  unmount() { Slots.gen++; document.removeEventListener('keydown', Slots.onKey); SFX.stop('reelSpin'); Slots.root = null; Slots.spinning = false; },
});
</script>

<script id="game-blackjack">
/* ================= BLACKJACK ================= */
const Blackjack = {
  root: null, deck: [], pHand: [], dHand: [], bet: 0, dealing: false, inRound: false, gen: 0, round: null,
  alive(gen) { return !!this.root && this.gen === gen; },
  cardEl(c, hidden = false) {
    const red = ['♥', '♦'].includes(c.suit);
    return h('div', { class: `pcard dealing${hidden ? ' hidden-card' : ''}` },
      h('div', { class: 'inner' },
        h('div', { class: `face${red ? ' red' : ''}` },
          h('span', { class: 'corner tl' }, c.val, h('br'), c.suit),
          h('span', { class: 'pip' }, c.suit),
          h('span', { class: 'corner br' }, c.val, h('br'), c.suit)),
        h('div', { class: 'back' })));
  },
  async dealTo(elId, card, hidden = false) {
    if (!this.round || !this.alive(this.round.gen)) return;
    qs('#' + elId, this.root).append(this.cardEl(card, hidden));
    SFX.play('cardSlide');
    await wait(240);
  },
  updateVals(revealDealer) {
    if (!this.round || !this.alive(this.round.gen)) return;
    qs('#bjPlayerVal', this.root).textContent = Rules.handSum(this.round.pHand);
    qs('#bjDealerVal', this.root).textContent = revealDealer ? Rules.handSum(this.round.dHand) : '?';
  },
  /* Hand ohne Abrechnung fallen lassen (Screen verlassen) – Einsatz ist bereits abgezogen */
  drop(round) { if (round && !round.done) { round.done = true; Game.forfeit(); } },
  async start() {
    if (this.inRound || !this.root) return;
    const bet = Game.readBet('bjBet');
    if (!Game.beginSpin(bet)) return;
    const gen = this.gen;
    this.inRound = true; this.dealing = true; this.bet = bet;
    this.deck = Rules.newDeck(Math.random); this.pHand = []; this.dHand = [];
    const round = { pHand: this.pHand, dHand: this.dHand, deck: this.deck, bet, gen, run: Game.run, done: false };
    this.round = round;
    try {
      qs('#playerCards', this.root).innerHTML = ''; qs('#dealerCards', this.root).innerHTML = '';
      qsa('.hand-val', this.root).forEach((v) => v.classList.remove('push'));
      qs('#bjBetControls', this.root).classList.add('hidden');
      qs('#bjActionControls', this.root).classList.remove('hidden');
      qs('#bjStatus', this.root).textContent = 'Hit oder Stand?';
      round.pHand.push(round.deck.pop()); await this.dealTo('playerCards', round.pHand[0]);
      round.dHand.push(round.deck.pop()); await this.dealTo('dealerCards', round.dHand[0], true);
      round.pHand.push(round.deck.pop()); await this.dealTo('playerCards', round.pHand[1]);
      round.dHand.push(round.deck.pop()); await this.dealTo('dealerCards', round.dHand[1]);
      this.updateVals(false);
    } finally {
      if (this.gen === gen) this.dealing = false;
      else this.drop(round); // Screen während des Austeilens verlassen
    }
  },
  async hit() {
    if (this.dealing || !this.inRound) return;
    const round = this.round;
    const gen = this.gen;
    this.dealing = true;
    try {
      const c = round.deck.pop();
      round.pHand.push(c);
      await this.dealTo('playerCards', c);
      this.updateVals(false);
    } finally {
      if (this.gen === gen) this.dealing = false;
    }
    if (Rules.handSum(round.pHand) > 21) await this.finish('bust', round);
    else if (!this.alive(gen)) this.drop(round); // Screen während der Karte verlassen
  },
  async stand() {
    if (this.dealing || !this.inRound) return;
    const round = this.round;
    const gen = this.gen;
    this.dealing = true;
    try {
      if (this.alive(round.gen)) {
        qs('#bjActionControls', this.root).classList.add('hidden');
        const hole = qs('#dealerCards .pcard', this.root);
        if (hole) hole.classList.remove('hidden-card');
        SFX.play('cardSlide');
        await wait(550);
        this.updateVals(true);
      }
      while (Rules.dealerShouldHit(round.dHand)) {
        const c = round.deck.pop();
        round.dHand.push(c);
        await this.dealTo('dealerCards', c);
        this.updateVals(true);
        await wait(300);
      }
    } finally {
      if (this.gen === gen) this.dealing = false;
    }
    await this.finish(Rules.bjOutcome(Rules.handSum(round.pHand), Rules.handSum(round.dHand)), round);
  },
  async finish(outcome, round) {
    if (round.done) return;
    round.done = true;
    const delta = Rules.bjDelta(outcome, round.bet);
    try {
      if (this.alive(round.gen)) {
        const msgs = {
          win: `<span class="win">Gewonnen · +${UI.fmt(round.bet)}</span>`,
          bust: `<span class="loss">Bust · über 21 · −${UI.fmt(round.bet)}</span>`,
          dealer: `<span class="loss">Dealer gewinnt · −${UI.fmt(round.bet)}</span>`,
          push: 'Push · Unentschieden',
        };
        qs('#bjStatus', this.root).innerHTML = msgs[outcome];
        if (outcome === 'bust') qsa('#playerCards .pcard', this.root).forEach((c) => c.classList.add('bust'));
        if (outcome === 'push') qsa('.hand-val', this.root).forEach((v) => v.classList.add('push'));
        qs('#bjActionControls', this.root).classList.add('hidden');
        qs('#bjBetControls', this.root).classList.remove('hidden');
      }
    } finally {
      if (this.gen === round.gen) { this.inRound = false; this.dealing = false; }
    }
    await Bus.emit('blackjack:result', { outcome, bet: round.bet });
    await Game.settle(delta, { from: this.alive(round.gen) ? qs('#playerCards', this.root) : null, game: 'blackjack', bet: round.bet, run: round.run });
  },
};

UI.register('blackjack', {
  template: 'tpl-blackjack',
  mount(root) {
    Blackjack.gen++;
    Blackjack.root = root;
    Game.bindBet(root, 'bjBet');
    qs('#btnDeal', root).addEventListener('click', () => Blackjack.start());
    qs('#btnHit', root).addEventListener('click', () => Blackjack.hit());
    qs('#btnStand', root).addEventListener('click', () => Blackjack.stand());
  },
  unmount() {
    Blackjack.gen++;
    if (Blackjack.inRound) {
      /* Zwischen zwei Aktionen verlassen: Hand sofort fallen lassen. Läuft noch eine Kette (dealing), räumt die selbst auf. */
      if (!Blackjack.dealing) Blackjack.drop(Blackjack.round);
      UI.toast({ icon: '🃏', title: 'Hand aufgegeben', text: 'Einsatz verfallen.', tone: 'loss' });
    }
    Blackjack.root = null; Blackjack.inRound = false; Blackjack.dealing = false;
  },
});
</script>

<script id="game-roulette">
/* ================= ROULETTE ================= */
const Roulette = {
  root: null, wheelDeg: 0, spinning: false, ballRaf: null, gen: 0,
  alive(gen) { return !!this.root && this.gen === gen; },
  buildTable() {
    const t = qs('#rtable', this.root);
    t.innerHTML = '';
    const cell = (label, cls, type, chosen, style) =>
      h('button', { class: `rcell ${cls}`, style, onclick: (e) => this.play(type, chosen, e.currentTarget) }, label);
    t.append(cell('0', 'zero', 'number', 0));
    for (let row = 0; row < 3; row++) for (let col = 0; col < 12; col++) {
      const n = col * 3 + (3 - row);
      t.append(cell(String(n), Rules.isRed(n) ? 'red' : 'black', 'number', n));
    }
    t.append(cell('Rot', 'out red', 'red', null, 'grid-column: 2 / span 3'), cell('Schwarz', 'out black', 'black', null),
      cell('Gerade', 'out', 'even', null), cell('Ungerade', 'out', 'odd', null));
  },
  drawWheel(highlight = -1) {
    const c = qs('#wheelCanvas', this.root);
    if (!c) return;
    const ctx = c.getContext('2d');
    const cx = 160, cy = 160, r = 150, total = 37, slice = (2 * Math.PI) / total;
    ctx.clearRect(0, 0, 320, 320);
    ctx.beginPath(); ctx.arc(cx, cy, r + 8, 0, 2 * Math.PI); ctx.fillStyle = '#4a2c14'; ctx.fill();
    for (let i = 0; i < total; i++) {
      const center = -Math.PI / 2 + i * slice;
      const num = Rules.WHEEL[i];
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, center - slice / 2, center + slice / 2); ctx.closePath();
      ctx.fillStyle = i === highlight ? '#e8c65a' : num === 0 ? '#1f7a4d' : Rules.isRed(num) ? '#b3261e' : '#1c1c1c';
      ctx.fill();
      ctx.strokeStyle = 'rgba(201,162,39,.5)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(center); ctx.translate(r - 16, 0); ctx.rotate(Math.PI / 2);
      ctx.fillStyle = i === highlight ? '#000' : '#fff'; ctx.font = 'bold 11px "Courier Prime", "Courier New", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(num), 0, 0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx, cy, r - 32, 0, 2 * Math.PI); ctx.fillStyle = '#141712'; ctx.fill(); ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 3; ctx.stroke();
    for (let k = 0; k < 8; k++) { ctx.save(); ctx.translate(cx, cy); ctx.rotate((k * Math.PI) / 4); ctx.fillStyle = '#c9a227'; ctx.fillRect(-2, -(r - 34), 4, r - 34 - 40); ctx.restore(); }
    ctx.beginPath(); ctx.arc(cx, cy, 40, 0, 2 * Math.PI); ctx.fillStyle = '#1b1f19'; ctx.fill(); ctx.strokeStyle = '#e8c65a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, 2 * Math.PI); ctx.fillStyle = '#e8c65a'; ctx.fill();
  },
  flyChip(cell, label, gen) {
    const from = qs('#balance').getBoundingClientRect();
    const to = cell.getBoundingClientRect();
    const c = h('div', { class: 'chip fly', style: `left:${from.left}px; top:${from.top}px` }, label);
    document.body.append(c);
    void c.offsetWidth;
    c.style.transform = `translate(${to.left + to.width / 2 - from.left - 23}px, ${to.top + to.height / 2 - from.top - 23}px)`;
    setTimeout(() => { c.remove(); if (this.alive(gen)) cell.append(h('div', { class: 'chip placed' }, label)); }, 420);
  },
  animateBall(dur, gen) {
    const ball = qs('#ball', this.root);
    if (!ball) return;
    if (this.ballRaf) cancelAnimationFrame(this.ballRaf);
    const start = performance.now(), R0 = 152, R1 = 134, turns = 4;
    let lastPocket = -1;
    const frame = (now) => {
      if (!this.alive(gen)) return;
      const p = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      const angle = -90 - turns * 360 * e;           // endet bei −90° = oben, unter dem Zeiger
      let r = R0;
      if (p > 0.65) { const q = (p - 0.65) / 0.35; r = R1 + (R0 - R1) * (1 - q) * Math.abs(Math.cos(q * Math.PI * 3)); }
      const rad = (angle * Math.PI) / 180;
      ball.style.transform = `translate(${160 + r * Math.cos(rad) - 7}px, ${160 + r * Math.sin(rad) - 7}px)`;
      const pocket = Math.floor((((angle % 360) + 360) % 360) / (360 / 37));
      if (pocket !== lastPocket && p < 0.97) { lastPocket = pocket; SFX.play('ballTick'); }
      if (p < 1) this.ballRaf = requestAnimationFrame(frame); else this.ballRaf = null;
    };
    this.ballRaf = requestAnimationFrame(frame);
  },
  async play(type, chosen, cell) {
    if (this.spinning || !this.root) return;
    const bet = Game.readBet('rouletteBet');
    if (!Game.beginSpin(bet)) return;
    const run = Game.run;
    const gen = this.gen;
    this.spinning = true;
    try {
      qs('#rtable', this.root).classList.add('locked');
      qsa('.chip.placed', this.root).forEach((c) => c.remove());
      this.flyChip(cell, String(bet), gen);
      SFX.play('chip');
      qs('#rouletteStatus', this.root).textContent = 'Kugel rollt…';
      qs('#resultNum', this.root).className = 'result-num';
      let rolled = Rules.rouletteRoll(Math.random);
      rolled = Rules.rouletteLuckOverride(type, chosen, rolled, Rules.luck(State.s), Math.random);
      const targetIdx = Rules.WHEEL.indexOf(rolled);
      const sliceDeg = 360 / 37;
      const targetDeg = (360 - targetIdx * sliceDeg) % 360;
      const currentMod = this.wheelDeg % 360;
      let diff = targetDeg - currentMod;
      if (diff <= 0) diff += 360;
      this.wheelDeg += 5 * 360 + diff;
      this.drawWheel(-1);
      qs('#wheelCanvas', this.root).style.transform = `rotate(${this.wheelDeg}deg)`;
      this.animateBall(4000, gen);
      await wait(4100);
      const delta = Rules.roulettePayout(type, chosen, rolled, bet);
      if (this.alive(gen)) {
        this.drawWheel(targetIdx);
        const res = qs('#resultNum', this.root);
        res.textContent = rolled;
        res.className = `result-num show ${rolled === 0 ? 'green' : Rules.isRed(rolled) ? 'red' : 'black'}`;
        const colName = rolled === 0 ? '🟢 0' : Rules.isRed(rolled) ? `🔴 ${rolled}` : `⚫ ${rolled}`;
        qs('#rouletteStatus', this.root).innerHTML = delta > 0
          ? `<span class="win">${colName} · +${UI.fmt(delta)}</span>`
          : `<span class="loss">${colName} · Niete · −${UI.fmt(bet)}</span>`;
        qsa('.chip.placed', this.root).forEach((c) => c.classList.add(delta > 0 ? 'won' : 'lost'));
      }
      await Bus.emit('roulette:result', { type, chosen, rolled, win: delta > 0, bet });
      await Game.settle(delta, { from: this.alive(gen) ? qs('.wheel-box', this.root) : null, game: 'roulette', bet, run });
    } finally {
      if (this.gen === gen) {
        this.spinning = false;
        qs('#rtable', this.root).classList.remove('locked');
      }
    }
  },
};

UI.register('roulette', {
  template: 'tpl-roulette',
  mount(root) {
    Roulette.gen++;
    Roulette.root = root;
    Roulette.buildTable();
    Roulette.drawWheel();
    qs('#wheelCanvas', root).style.transform = `rotate(${Roulette.wheelDeg}deg)`;
    Game.bindBet(root, 'rouletteBet');
  },
  unmount() {
    Roulette.gen++;
    if (Roulette.ballRaf) cancelAnimationFrame(Roulette.ballRaf);
    Roulette.ballRaf = null;
    Roulette.root = null;
    Roulette.spinning = false;
  },
});
</script>

<script id="game-horses">
/* ================= PFERDERENNEN ================= */
const Horses = {
  root: null, racing: false, loop: null, commentTimer: null, resolveRace: null, gen: 0,
  alive(gen) { return !!this.root && this.gen === gen; },
  build() {
    const track = qs('#track', this.root);
    qsa('.lane', track).forEach((l) => l.remove());
    const picks = qs('#horsePicks', this.root);
    picks.innerHTML = '';
    for (const hrs of Rules.HORSES) {
      track.append(h('div', { class: 'lane' }, h('div', { class: 'gate' }),
        h('div', { class: 'runner', id: `h-${hrs.id}`, style: `--hc: ${hrs.col}` }, h('span', { class: 'horse' }, '🏇'), h('span', { class: 'tag' }, hrs.name))));
      picks.append(h('button', { class: 'pick' + (hrs.id === State.s.selectedHorse ? ' on' : ''), id: `pick-${hrs.id}`, style: `--hc: ${hrs.col}`, onclick: () => this.pick(hrs.id) },
        `${hrs.dot} ${hrs.name}`, h('small', {}, 'Quote 4.0')));
    }
  },
  pick(id) {
    if (this.racing) return;
    State.s.selectedHorse = id;
    State.save();
    qsa('.pick', this.root).forEach((p) => p.classList.toggle('on', p.id === `pick-${id}`));
    SFX.play('click');
  },
  comment(pos) {
    if (!this.root) return;
    const order = Rules.HORSES.map((hrs, i) => ({ hrs, p: pos[i] })).sort((a, b) => b.p - a.p);
    const lead = order[0], second = order[1], last = order[3];
    const gap = lead.p - second.p;
    const mine = lead.hrs.id === State.s.selectedHorse;
    const lines = gap < 10 ? [`Kopf an Kopf – ${lead.hrs.name} und ${second.hrs.name}!`, 'Das wird eng!']
      : gap > 40 ? [`${lead.hrs.name} zieht davon!`, `${lead.hrs.name} führt klar, ${last.hrs.name} hängt hinten.`]
        : [`${lead.hrs.name} vorn, ${second.hrs.name} dran.`, `${second.hrs.name} holt auf!`];
    if (mine) lines.push('Dein Pferd liegt vorn!');
    qs('#commentary', this.root).textContent = pick(lines);
  },
  dust(runner, x) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const lane = runner.parentElement;
    const d = h('span', { class: 'dust', style: `left:${runner.offsetLeft + x + 4}px; top:${runner.offsetTop + 34}px` });
    lane.append(d);
    setTimeout(() => d.remove(), 650);
  },
  async start() {
    if (this.racing || !this.root) return;
    const bet = Game.readBet('horseBet');
    if (!Game.beginSpin(bet)) return;
    const run = Game.run;
    const gen = this.gen;
    this.racing = true;
    try {
      qs('#btnRace', this.root).disabled = true;
      qs('#horseStatus', this.root).textContent = '';
      const track = qs('#track', this.root);
      const goal = track.clientWidth - 65;
      const pos = [0, 0, 0, 0];
      const luck = Rules.luck(State.s);
      const selected = State.s.selectedHorse;
      const runners = Rules.HORSES.map((hrs) => qs(`#h-${hrs.id}`, this.root));
      runners.forEach((r) => { r.style.transform = 'translateX(0)'; r.classList.add('running'); });
      SFX.play('whinny');
      SFX.loop('gallop', 260);
      this.commentTimer = setInterval(() => this.comment(pos), 600);
      let tick = 0;
      const winner = await new Promise((resolve) => {
        this.resolveRace = resolve;
        this.loop = setInterval(() => {
          if (!this.alive(gen)) { clearInterval(this.loop); this.resolveRace = null; resolve(null); return; }
          let win = null;
          Rules.HORSES.forEach((hrs, i) => {
            pos[i] += Rules.horseStep(hrs.id === selected, luck, Math.random);
            runners[i].style.transform = `translateX(${pos[i]}px)`;
            if (tick % 4 === i) this.dust(runners[i], pos[i]);
            if (pos[i] >= goal && !win) win = hrs;
          });
          tick++;
          if (win) { clearInterval(this.loop); this.resolveRace = null; resolve(win); }
        }, 30);
      });
      clearInterval(this.commentTimer);
      SFX.stop('gallop');
      if (!winner) { Game.forfeit(); return; } // Rennen abgebrochen (Screen verlassen) – Einsatz verfällt
      const won = winner.id === selected;
      const delta = Rules.horseDelta(won, bet);
      if (this.alive(gen)) {
        const flash = qs('#photoFlash', this.root);
        flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
        runners.forEach((r) => r.classList.remove('running'));
        const wr = qs(`#h-${winner.id}`, this.root);
        wr.classList.add('running');
        wr.style.transition = 'transform .7s ease-in';
        wr.style.transform = `translateX(${track.clientWidth + 40}px)`;
        setTimeout(() => { if (wr.isConnected) { wr.style.transition = ''; wr.classList.remove('running'); } }, 800);
        qs('#commentary', this.root).textContent = `${winner.name} gewinnt!`;
        qs('#horseStatus', this.root).innerHTML = won
          ? `<span class="win">${winner.name} siegt · +${UI.fmt(bet * 3)}</span>`
          : `<span class="loss">${winner.name} siegt · −${UI.fmt(bet)}</span>`;
        qs('#btnRace', this.root).disabled = false;
      }
      await Bus.emit('horses:result', { winner: winner.id, selected, bet });
      await Game.settle(delta, { from: this.alive(gen) ? qs('#track', this.root) : null, game: 'horses', bet, run });
    } finally {
      if (this.gen === gen) this.racing = false;
    }
  },
};

UI.register('horses', {
  template: 'tpl-horses',
  mount(root) {
    Horses.gen++;
    Horses.root = root;
    Horses.build();
    Game.bindBet(root, 'horseBet');
    qs('#btnRace', root).addEventListener('click', () => Horses.start());
  },
  unmount() {
    Horses.gen++;
    clearInterval(Horses.loop);
    clearInterval(Horses.commentTimer);
    if (Horses.resolveRace) {
      Horses.resolveRace(null); Horses.resolveRace = null;
      UI.toast({ icon: '🏇', title: 'Einsatz verfallen', text: 'Rennen ohne dich beendet.', tone: 'loss' });
    }
    SFX.stop('gallop');
    Horses.root = null;
    Horses.racing = false;
  },
});
</script>

<script id="game-russian">
/* ================= RUSSISCHES ROULETTE ================= */
const Russian = {
  root: null, duel: null, inDuel: false, busy: false, gen: 0,
  alive(gen) { return !!this.root && this.gen === gen; },
  drawCylinder() {
    const svg = qs('#cylinder', this.root);
    const ns = 'http://www.w3.org/2000/svg';
    svg.innerHTML = '';
    const el = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
    svg.append(el('circle', { cx: 100, cy: 100, r: 92, fill: '#2a2f36', stroke: '#8a94a0', 'stroke-width': 4 }));
    for (let i = 0; i < 6; i++) {
      const a = (-90 + i * 60) * Math.PI / 180;
      const c = el('circle', { cx: 100 + 56 * Math.cos(a), cy: 100 + 56 * Math.sin(a), r: 19, fill: '#0b0d10', stroke: '#8a94a0', 'stroke-width': 3, class: 'chamber', 'data-i': i });
      svg.append(c);
    }
    svg.append(el('circle', { cx: 100, cy: 100, r: 14, fill: '#8a94a0' }));
  },
  rotateTo(idx, gen) {
    if (!this.alive(gen)) return;
    const svg = qs('#cylinder', this.root);
    if (!svg) return;
    svg.style.transform = `rotate(${-60 * idx}deg)`;
    const box = svg.parentElement;
    box.classList.remove('zoom'); void box.offsetWidth; box.classList.add('zoom');
    qs('#chambersLeft', this.root).textContent = `${6 - idx} Kammer${6 - idx === 1 ? '' : 'n'}`;
  },
  markSpent(idx, gen) {
    if (!this.alive(gen)) return;
    const c = qs(`.chamber[data-i="${idx}"]`, this.root);
    if (c) { c.setAttribute('fill', '#3a3f46'); c.setAttribute('stroke', '#555'); }
    const left = 6 - (idx + 1);
    qs('#chambersLeft', this.root).textContent = `${left} Kammer${left === 1 ? '' : 'n'} übrig`;
  },
  setTurn(who) {
    if (!this.root) return;
    qs('#fPlayer', this.root).classList.toggle('turn', who === 'player');
    qs('#fIgor', this.root).classList.toggle('turn', who === 'igor');
  },
  heartbeat(duel) {
    if (!this.alive(duel.gen)) return;
    SFX.loop('heartbeat', Math.max(380, 900 - duel.idx * 110));
  },
  /* Duell ohne Abrechnung abbrechen (Screen verlassen) – Einsatz ist bereits abgezogen */
  drop(duel) {
    if (!duel || duel.done) return;
    duel.done = true;
    if (duel.forced) { Bus.emit('rr:forced', { victim: 'aborted' }); return; }
    Game.forfeit();
  },
  async start(opts = {}) {
    if (this.inDuel || !this.root) return;
    const forced = !!opts.forced;
    const bet = forced ? 0 : Game.readBet('rrBet');
    if (!forced && !Game.beginSpin(bet)) return;
    const gen = this.gen;
    const duel = { cylinder: Rules.rrCylinder(Math.random), idx: 0, bet, gen, run: forced ? null : Game.run, done: false, forced };
    this.duel = duel;
    this.inDuel = true;
    if (this.alive(gen)) {
      qs('#fPlayer', this.root).classList.remove('dead'); qs('#fIgor', this.root).classList.remove('dead');
      this.drawCylinder();
      qs('#cylinder', this.root).style.transform = 'rotate(0deg)';
      qs('#chambersLeft', this.root).textContent = '6 Kammern';
      qs('#rrBetControls', this.root).classList.add('hidden');
      qs('#rrActionControls', this.root).classList.remove('hidden');
    }
    if (!State.s.flags.igor) { State.s.flags.igor = true; State.save(); await Cutscene.play('igor.first', {}); }
    if (!this.alive(gen)) return;
    qs('#rrStatus', this.root).textContent = forced ? 'Vitos Prüfung. Kein Einsatz – nur dein Kopf. Drück ab.' : 'Du bist dran. Drück ab.';
    this.setTurn('player');
    this.heartbeat(duel);
  },
  async bang(who, gen) {
    if (this.alive(gen)) {
      const flash = qs('#rrFlash', this.root);
      flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
      SFX.stopAll(); SFX.play('gunshot');
      UI.shake(qs('#shell'));
      qs(who === 'player' ? '#fPlayer' : '#fIgor', this.root).classList.add('dead');
      qs(who === 'player' ? '#fPlayer .face' : '#fIgor .face', this.root).textContent = '💀';
    }
    await wait(600);
  },
  async pull() {
    if (!this.inDuel || this.busy || !this.root) return;
    const duel = this.duel;
    const gen = duel.gen;
    this.busy = true;
    try {
      if (this.alive(gen)) qs('#btnTrigger', this.root).disabled = true;
      this.rotateTo(duel.idx, gen);
      await wait(350);
      if (duel.cylinder[duel.idx]) {
        if (this.alive(gen)) qs('#rrStatus', this.root).innerHTML = duel.forced ? `<span class="loss">PÄNG · Streifschuss</span>` : `<span class="loss">PÄNG · Streifschuss · −${UI.fmt(duel.bet)} & 100 € Spital</span>`;
        await this.bang('player', gen);
        await this.end('player', duel);
        return;
      }
      if (this.alive(gen)) SFX.play('dryfire');
      this.markSpent(duel.idx, gen);
      duel.idx++;
      if (this.alive(gen)) { qs('#rrStatus', this.root).textContent = '*Klick*… Leer. Igor ist dran…'; this.setTurn('igor'); }
      this.heartbeat(duel);
      await wait(1100);
      this.rotateTo(duel.idx, gen);
      await wait(350);
      if (duel.cylinder[duel.idx]) {
        if (this.alive(gen)) qs('#rrStatus', this.root).innerHTML = duel.forced ? `<span class="win">PÄNG · Igor liegt</span>` : `<span class="win">PÄNG · Igor liegt · +${UI.fmt(duel.bet)}</span>`;
        await this.bang('igor', gen);
        await this.end('igor', duel);
        return;
      }
      if (this.alive(gen)) SFX.play('dryfire');
      this.markSpent(duel.idx, gen);
      duel.idx++;
      if (this.alive(gen)) {
        qs('#rrStatus', this.root).textContent = '*Klick*… Igor lebt. Du bist dran.';
        this.setTurn('player');
        qs('#btnTrigger', this.root).disabled = false;
      }
      this.heartbeat(duel);
      if (!this.alive(gen)) this.drop(duel); // Screen während des Zugs verlassen, Duell nicht entschieden
    } finally {
      if (this.gen === gen) this.busy = false;
    }
  },
  async end(victim, duel) {
    if (duel.done) return;
    duel.done = true;
    const gen = duel.gen;
    if (this.alive(gen)) SFX.stopAll(); else SFX.stop('heartbeat');
    try {
      if (this.alive(gen)) {
        this.setTurn(null);
        qs('#rrActionControls', this.root).classList.add('hidden');
        qs('#rrBetControls', this.root).classList.remove('hidden');
        qs('#btnTrigger', this.root).disabled = false;
      }
    } finally {
      if (this.gen === gen) { this.inDuel = false; this.busy = false; }
    }
    if (duel.forced) { await Bus.emit('rr:forced', { victim }); return; }
    const delta = Rules.rrDelta(victim, duel.bet);
    await Bus.emit('rr:result', { victim, bet: duel.bet });
    if (victim === 'player' && this.alive(gen)) await Cutscene.play('rr.headshot', {});
    await Game.settle(delta, { from: this.alive(gen) ? qs('.duel', this.root) : null, game: 'russian', bet: duel.bet, run: duel.run });
  },
};

UI.register('russian', {
  template: 'tpl-russian',
  mount(root) {
    Russian.gen++;
    Russian.root = root;
    Russian.drawCylinder();
    Game.bindBet(root, 'rrBet');
    qs('#btnDuel', root).addEventListener('click', () => Russian.start());
    qs('#btnTrigger', root).addEventListener('click', () => Russian.pull());
  },
  unmount() {
    Russian.gen++;
    SFX.stop('heartbeat');
    if (Russian.inDuel) {
      /* Zwischen zwei Zügen verlassen: Duell sofort abbrechen. Läuft noch ein Zug (busy), räumt der selbst auf bzw. rechnet ab. */
      const wasForced = Russian.duel && Russian.duel.forced;
      if (!Russian.busy) Russian.drop(Russian.duel);
      if (!wasForced) UI.toast({ icon: '🔫', title: 'Duell abgebrochen', text: 'Einsatz verfallen.', tone: 'loss' });
    }
    Russian.root = null;
    Russian.inDuel = false;
    Russian.busy = false;
  },
});

Cutscene.define('igor.first', [
  { bg: 'keller', who: 'igor', mood: 'calm', text: '…' },
  { bg: 'keller', who: 'igor', mood: 'calm', text: 'Eine Kugel. Sechs Kammern. Du zuerst. Ich habe Zeit.' },
]);
Cutscene.define('rr.headshot', [
  { bg: 'klinik', who: 'doc', mood: 'shock', fx: 'flash', text: 'Streifschuss! Du Glückspilz. Hundert Euro fürs Pflaster – und für meine Nerven.' },
]);
</script>

<script id="game-postman">
/* ================= POST AUSTRAGEN ================= */
const Postman = {
  root: null, streak: 0, timer: null, timeLeft: 0, target: null, tier: null, active: false, busy: false, gen: 0,
  alive(gen) { return !!this.root && this.gen === gen; },
  renderHouses() {
    const box = qs('#houses', this.root);
    box.innerHTML = '';
    for (const hs of [...Rules.POST_HOUSES].sort(() => Math.random() - 0.5)) {
      box.append(h('button', { class: 'house', 'data-n': hs.n, style: `--hc: ${hs.c}`, onclick: () => this.deliver(hs.n) },
        h('div', { class: 'roof' }), h('div', { class: 'wall' }, `#${hs.n}`), h('div', { class: 'mailbox' }, '📫', h('div', { class: 'flag' }))));
    }
  },
  startShift() {
    if (this.active || !this.root) return;
    const gen = this.gen;
    this.active = true; this.streak = 0;
    qs('#btnShift', this.root).classList.add('hidden');
    qs('#fuseWrap', this.root).classList.remove('hidden');
    qs('#letter', this.root).classList.remove('hidden');
    qs('#jobStatus', this.root).textContent = '';
    this.nextStep(gen);
  },
  nextStep(gen) {
    clearInterval(this.timer);
    if (!this.alive(gen)) return;
    if (State.mode === 'story' && this.streak >= 15) { this.endShift('Feierabend! 15 Briefe ausgetragen.'); return; }
    const prevTier = this.tier;
    this.tier = Rules.postmanTier(this.streak);
    if (prevTier && prevTier.t !== this.tier.t) this.stamp();
    this.timeLeft = this.tier.t;
    this.target = pick(Rules.POST_HOUSES);
    qs('#letter', this.root).innerHTML = `An: <b style="color:${this.target.c}">Haus #${this.target.n}</b><br>${this.tier.r} € Lohn`;
    qs('#streak', this.root).innerHTML = `${this.streak}<span> in Folge</span>`;
    this.renderHouses();
    const fuse = qs('#fuse', this.root), spark = qs('#spark', this.root);
    fuse.style.width = '100%'; spark.style.left = '100%';
    this.timer = setInterval(() => {
      if (!this.alive(gen)) { clearInterval(this.timer); return; }
      this.timeLeft -= 0.05;
      const pct = Math.max(0, (this.timeLeft / this.tier.t) * 100);
      fuse.style.width = pct + '%'; spark.style.left = pct + '%';
      if (this.timeLeft <= 0) { clearInterval(this.timer); this.fail('Zu langsam!', null, gen); }
    }, 50);
  },
  stamp() {
    const st = qs('#stamp', this.root);
    st.classList.remove('hidden'); st.style.animation = 'none'; void st.offsetWidth; st.style.animation = '';
    SFX.play('stamp');
    setTimeout(() => st.classList.add('hidden'), 900);
  },
  async deliver(n) {
    if (!this.active || !this.root || this.busy) return;
    const gen = this.gen;
    this.busy = true;
    try {
      clearInterval(this.timer);
      const house = qs(`.house[data-n="${n}"]`, this.root);
      if (n === this.target.n) {
        const reward = this.tier.r;
        house.classList.add('delivered');
        const from = qs('#letter', this.root).getBoundingClientRect(), to = qs('.mailbox', house).getBoundingClientRect(), st = qs('#street', this.root).getBoundingClientRect();
        const env = h('span', { class: 'envelope', style: `left:${from.left - st.left}px; top:${from.top - st.top}px` }, '✉️');
        qs('#street', this.root).append(env);
        void env.offsetWidth;
        env.style.transform = `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(.5)`; env.style.opacity = '0';
        setTimeout(() => env.remove(), 400);
        SFX.play('coin');
        Game.applyDelta(reward, { from: house });
        this.streak++;
        if (this.streak > State.s.stats.postStreakBest) { State.s.stats.postStreakBest = this.streak; State.save(); }
        qs('#jobStatus', this.root).innerHTML = `<span class="win">+${UI.fmt(reward)}</span>`;
        await Bus.emit('post:streak', { streak: this.streak });
        await wait(250);
        if (!this.alive(gen)) return;
        this.nextStep(gen);
      } else {
        this.fail('Falscher Kasten!', house, gen);
      }
    } finally {
      if (this.gen === gen) this.busy = false;
    }
  },
  fail(msg, house, gen) {
    clearInterval(this.timer);
    if (this.gen === gen) this.active = false;
    if (!this.alive(gen)) return;
    const target = house || qs(`.house[data-n="${this.target.n}"]`, this.root);
    if (target) { target.append(h('span', { class: 'dog' }, '🐕')); }
    SFX.play('dog');
    UI.shake(qs('#street', this.root));
    Game.applyDelta(-Rules.POST_PENALTY, { from: target });
    qs('#fuseWrap', this.root).classList.add('hidden');
    qs('#letter', this.root).classList.add('hidden');
    qs('#jobStatus', this.root).innerHTML = `<span class="loss">${msg} 25 € Strafe. Schicht beendet nach ${this.streak} Briefen.</span>`;
    qs('#btnShift', this.root).classList.remove('hidden');
    this.tier = null;
    if (State.mode === 'story') Jobs.finishGame('post');
    if (Rules.isGameOver(State.s)) Bus.emit('gameover', {});
  },
  endShift(msg) {
    clearInterval(this.timer);
    this.active = false;
    if (this.root) {
      qs('#fuseWrap', this.root).classList.add('hidden');
      qs('#letter', this.root).classList.add('hidden');
      qs('#jobStatus', this.root).innerHTML = `<span class="win">${msg}</span>`;
      qs('#btnShift', this.root).classList.remove('hidden');
    }
    this.tier = null;
    if (State.mode === 'story') Jobs.finishGame('post');
  },
};

UI.register('postman', {
  template: 'tpl-postman',
  mount(root) {
    Postman.gen++;
    Postman.root = root;
    Postman.streak = 0; Postman.active = false; Postman.tier = null;
    Postman.renderHouses();
    qs('#btnShift', root).addEventListener('click', () => Postman.startShift());
  },
  unmount() {
    if (State.mode === 'story' && Postman.active) Jobs.abort();
    Postman.gen++;
    clearInterval(Postman.timer);
    Postman.root = null;
    Postman.active = false;
    Postman.busy = false;
  },
});
</script>

<script id="achievements">
/* ================= ACHIEVEMENTS ================= */
const Achievements = {
  DEFS: [
    { id: 'firstWin', title: 'Erster Gewinn', icon: '🎉', desc: 'Zum ersten Mal gewonnen.' },
    { id: 'highRoller', title: 'Hoch gepokert', icon: '💸', desc: 'Einsatz von mindestens 500 €.' },
    { id: 'jackpot', title: 'Jackpot', icon: '7️⃣', desc: '7-7-7 an den Slots.' },
    { id: 'plein', title: 'Plein', icon: '🎯', desc: 'Roulette-Zahl getroffen.' },
    { id: 'igor', title: 'Igor besiegt', icon: '🐻', desc: 'Das Duell überlebt – Igor nicht.' },
    { id: 'regular', title: 'Stammgast', icon: '🍺', desc: 'Drei Bier gleichzeitig.' },
    { id: 'donor', title: 'Organspender', icon: '🫁', desc: 'Niere verkauft.' },
    { id: 'owner', title: 'Hausbesitzer', icon: '🏰', desc: 'Penthouse gekauft.' },
    { id: 'divorced', title: 'Frisch geschieden', icon: '💔', desc: 'Chantal hat die Papiere geschickt.' },
    { id: 'vitosFriend', title: 'Vitos Freund', icon: '🕶️', desc: 'Mafia-Kredit fristgerecht getilgt.' },
    { id: 'postman', title: 'Fleißiger Bote', icon: '📬', desc: '11 Briefe in Folge.' },
    { id: 'phoenix', title: 'Auferstanden', icon: '🔥', desc: 'Nach dem Game Over weitergespielt.' },
  ],
  has(id) { return State.meta.achievements.includes(id); },
  unlock(id) {
    if (this.has(id)) return;
    const d = this.DEFS.find((x) => x.id === id);
    if (!d) { console.warn('[achievements] unbekannt:', id); return; }
    State.meta.achievements.push(id);
    State.saveMeta();
    SFX.play('unlock');
    UI.toast({ icon: d.icon, title: `Trophäe: ${d.title}`, text: d.desc, tone: 'gold', ms: 4000 });
    const grid = qs('#trophyGrid');
    if (grid) { this.renderWall(grid); const t = qs(`[data-id="${id}"]`, grid); if (t) t.classList.add('fresh'); }
    Bus.emit('achievement:unlock', { id });
  },
  renderWall(grid) {
    grid.innerHTML = '';

  { bg: 'hafen-morgen', who: 'vito', mood: 'calm', text: 'Die Bank will nichts mehr von dir, ich habe schon etwas von dir, und dein Konto steht bei {{balance}}. Das nennt man ein Ende.' },
  { bg: 'hafen-morgen', who: 'vito', mood: 'happy', fx: 'stats', text: 'Aber ich bin kein Unmensch. Fünfzig Euro und ein neuer Anfang. Wir sehen uns unten.',
    choices: [{ label: 'Nochmal', value: 'again', cls: 'red' }] },
]);

async function restartGame({ playIntro }) {
  State.reset();
  State.s.flags.intro = true;
  State.save();
  UI.setBalance(State.s.balance, { animate: false });
  UI.renderWallet();
  UI.renderSide();
  await UI.show('hub');
  if (playIntro) await Cutscene.play('intro');
}

let gameOverPending = false;
Bus.on('gameover', async () => {
  if (State.mode === 'story') return;
  if (gameOverPending) return;
  gameOverPending = true;
  const s = State.s;
  const stats = {
    Spins: s.stats.spins,
    'Höchster Kontostand': UI.fmt(s.stats.maxBalance),
    'Größter Gewinn': UI.fmt(s.stats.biggestWin),
    'Verkaufte Nieren': s.stats.kidneys,
    'Beste Post-Serie': s.stats.postStreakBest,
    'Game Overs': State.meta.gameOvers + 1,
  };
  SFX.stopAll();
  await Cutscene.play('gameover', { balance: UI.fmt(s.balance), stats });
  State.meta.gameOvers++;
  State.saveMeta();
  try {
    await restartGame({ playIntro: false });
  } finally {
    gameOverPending = false;
  }
  UI.toast({ icon: '🌅', title: 'Neuer Anfang', text: '50 € und ein Kater. Auf geht’s.', tone: 'gold' });
  await Bus.emit('gameover:restart', {});
});

Bus.on('newgame.request', async () => {
  if (Cutscene.active) return;
  if (Game.inFlight > 0) { UI.toast({ icon: '⏳', title: 'Erst die Runde beenden', text: 'Ein Spiel läuft noch.', tone: 'loss' }); return; }
  if (State.mode === 'story') return Story.enter('newstory');
  const c = await Cutscene.play('newgame.confirm', {});
  if (c !== 'yes') return;
  await restartGame({ playIntro: true });
});

<script id="story-rules">
/* ================= STORY RULES – pure Engine-Regeln, kein DOM ================= */
const StoryRules = {
  OPS: ['eq', 'ne', 'gte', 'lte', 'gt', 'lt'],
  cmp(op, a, b) {
    switch (op) {
      case 'eq': return a === b; case 'ne': return a !== b;
      case 'gte': return a >= b; case 'lte': return a <= b;
      case 'gt': return a > b; case 'lt': return a < b;
      default: throw new Error(`Ungültige Bedingung: Operator ${op}`);
    }
  },
  _ops(obj, value) {
    const keys = Object.keys(obj).filter((k) => StoryRules.OPS.includes(k));
    if (!keys.length) throw new Error(`Ungültige Bedingung: ${JSON.stringify(obj)}`);
    return keys.every((k) => StoryRules.cmp(k, value, obj[k]));
  },
  check(cond, s) {
    if (cond == null) return true;
    const st = s.story;
    if ('all' in cond) return cond.all.every((c) => StoryRules.check(c, s));
    if ('any' in cond) return cond.any.some((c) => StoryRules.check(c, s));
    if ('not' in cond) return !StoryRules.check(cond.not, s);
    if ('day' in cond) return StoryRules._ops(cond.day, st.day);
    if ('balance' in cond) return StoryRules._ops(cond.balance, s.balance);
    if ('var' in cond) return StoryRules._ops(cond, st.vars[cond.var] || 0);
    if ('jobDone' in cond) return StoryRules._ops(cond, st.jobsDone[cond.jobDone] || 0);
    if ('flag' in cond) return !!st.flags[cond.flag];
    if ('notFlag' in cond) return !st.flags[cond.notFlag];
    if ('unlocked' in cond) return ['jobs', 'doors', 'rooms'].some((k) => st.unlocked[k].includes(cond.unlocked));
    throw new Error(`Ungültige Bedingung: ${JSON.stringify(cond)}`);
  },
  applyEffect(s, eff, story = {}) {
    const st = s.story;
    if ('var' in eff) {
      const max = (story.varMax || {})[eff.var];
      let v = 'set' in eff ? eff.set : (st.vars[eff.var] || 0) + (eff.add || 0);
      if (max != null) v = Math.min(max, v);
      if ('add' in eff) v = Math.max(0, v);
      st.vars[eff.var] = v;
      return {};
    }
    if ('flag' in eff) { st.flags[eff.flag] = true; return {}; }
    if ('unflag' in eff) { st.flags[eff.unflag] = false; return {}; }
    if ('balance' in eff) { s.balance += eff.balance; return {}; }
    if ('balancePct' in eff) { s.balance += Math.round(s.balance * eff.balancePct / 100); if (eff.min != null) s.balance = Math.max(eff.min, s.balance); return {}; }
    if ('unlock' in eff) {
      for (const k of ['jobs', 'doors', 'rooms']) for (const id of eff.unlock[k] || []) if (!st.unlocked[k].includes(id)) st.unlocked[k].push(id);
      return {};
    }
    const out = {};
    if ('force' in eff) out.force = eff.force;
    if ('loseDay' in eff) out.loseDay = true;
    if ('scene' in eff) out.scene = eff.scene;
    return out;
  },
  pickStory(stories, storyRuns, rng) {
    const cands = stories.filter((st) => !st.dev);
    const last = (st) => (storyRuns[st.id] && storyRuns[st.id].lastPlayed) || 0;
    const min = Math.min(...cands.map(last));
    const oldest = cands.filter((st) => last(st) === min);
    return oldest[Math.floor(rng() * oldest.length)].id;
  },
  chapterFor(story, s) {
    let found = null;
    for (const ch of story.chapters) if (StoryRules.check(ch.when, s)) found = ch;
    return found;
  },
  dueEvents(story, s, at) {
    return story.events.filter((e) => e.at === at && !(e.once && s.story.seen.includes(e.id)) && StoryRules.check(e.when, s));
  },
  ending(story, s) {
    const sorted = story.endings.filter((e) => !e.fallback).slice().sort((a, b) => b.priority - a.priority);
    for (const e of sorted) if (StoryRules.check(e.when, s)) return e;
    if (s.story.day > story.days) return story.endings.find((e) => e.fallback) || null;
    return null;
  },
  advanceDay(s) { s.story.day++; s.story.phase = 'morning'; s.story.jobToday = null; },
  jobAvailable(job, s) {
    const st = s.story;
    if (!st.unlocked.jobs.includes(job.id)) return { ok: false, reason: 'locked' };
    if (st.jobToday) return { ok: false, reason: 'done' };
    if (job.requires && !StoryRules.check(job.requires, s)) return { ok: false, reason: job.requireText || 'Voraussetzung fehlt' };
    return { ok: true };
  },
  spuelerPay(hits, breaks) { return hits * 5 - breaks * 10; },
  taxiPay(passengers, tickets) { return passengers * 15 - tickets * 50; },
  validate(story, sceneIds, jobIds) {
    const errs = [];
    const scene = (id, where) => { if (id && !sceneIds.includes(id)) errs.push(`${story.id}: Szene "${id}" fehlt (${where})`); };
    const jobs = (list, where) => (list || []).forEach((j) => { if (!jobIds.includes(j)) errs.push(`${story.id}: Job "${j}" unbekannt (${where})`); });
    scene(story.intro, 'intro');
    jobs(story.start && story.start.unlocked && story.start.unlocked.jobs, 'start');
    for (const ch of story.chapters || []) { scene(ch.intro, ch.id); jobs(ch.unlock && ch.unlock.jobs, ch.id); }
    for (const e of story.events || []) { scene(e.scene, e.id); for (const eff of e.effects || []) { scene(eff.scene, e.id); jobs(eff.unlock && eff.unlock.jobs, e.id); } }
    for (const [job, list] of Object.entries(story.jobScenes || {})) { jobs([job], 'jobScenes'); list.forEach((id) => scene(id, `jobScenes.${job}`)); }
    for (const e of story.endings || []) scene(e.scene, e.id);
    if ((story.endings || []).filter((e) => e.fallback).length !== 1) errs.push(`${story.id}: genau ein Fallback-Ende nötig`);
    return errs;
  },
  freshStoryPart(story) {
    return {
      id: story.id, day: 1, phase: 'morning',
      vars: Object.assign({}, story.start.vars), flags: {},
      unlocked: { jobs: [...story.start.unlocked.jobs], doors: [...story.start.unlocked.doors], rooms: [...story.start.unlocked.rooms] },
      jobsDone: {}, jobToday: null, seen: [], seenJobScenes: {}, ended: null,
      stats: { earned: 0, gambled: 0, jobs: 0 },
    };
  },
};
</script>

<script id="title">
/* ================= TITELSCREEN – Modus-Wahl ================= */
const Title = {
  root: null,
  show() {
    if (!qs('#title').hidden) return Promise.resolve(null);
    return new Promise((resolve) => {
      const root = qs('#title');
      root.innerHTML = '';
      root.appendChild(qs('#tpl-title').content.cloneNode(true));
      root.hidden = false;
      document.body.classList.add('title-open');
      const hasRun = State.hasStoryRun();
      const tag = qs('#titleStoryTag', root);
      if (hasRun && typeof Stories !== 'undefined') {
        const info = Stories.runInfo();
        tag.textContent = `Fortsetzen · ${info.title} · Tag ${info.day}/${info.days}`;
        qs('#titleNewStory', root).classList.remove('hidden');
      } else {
        tag.textContent = 'Neue Story';
      }
      qs('#titleMute', root).textContent = State.meta.muted ? '🔇' : '🔊';
      qs('#titleMute', root).addEventListener('click', (e) => { SFX.setMuted(!State.meta.muted); e.currentTarget.textContent = State.meta.muted ? '🔇' : '🔊'; });
      const done = (v) => { Title.hide(); resolve(v); };
      qsa('.title-door', root).forEach((d) => {
        d.addEventListener('mouseenter', () => SFX.play('neonBuzz'));
        d.addEventListener('click', () => { SFX.play('click'); done(d.dataset.choice === 'story' ? (hasRun ? 'story' : 'newstory') : 'free'); });
      });
      qs('#titleNewStory', root).addEventListener('click', () => { SFX.play('click'); done('newstory'); });
    });
  },
  hide() { const root = qs('#title'); root.hidden = true; root.innerHTML = ''; document.body.classList.remove('title-open'); },
  /* Vom Wallet-Knopf: zurück zum Titel, dann Modus wechseln */
  async open() {
    if (typeof Story !== 'undefined' && Story.sleeping) { UI.toast({ icon: '⏳', title: 'Erst die Nacht abwarten' }); return; }
    if (typeof Russian !== 'undefined' && Russian.inDuel && Russian.duel && Russian.duel.forced) { UI.toast({ icon: '⏳', title: 'Erst das Duell beenden' }); return; }
    if (Cutscene.active || Game.inFlight > 0) { UI.toast({ icon: '⏳', title: 'Erst die Runde beenden' }); return; }
    State.save();
    const choice = await Title.show();
    if (!choice) return;
    await Modes.enter(choice);
  },
};
/* Modus betreten – Story-Teil kommt in Task 3 (Story.enter); hier nur das freie Spiel */
const Modes = {
  async enter(choice) {
    if (choice === 'free') {
      State.setMode('free');
      document.body.classList.remove('mode-story'); document.body.classList.add('mode-free');
      UI.mountShell();
      if (typeof Story !== 'undefined') Story.renderDaybar();
      const showLoaded = Modes.freeLoaded; Modes.freeLoaded = false;
      await UI.show('hub');
      if (Rules.isGameOver(State.s)) await Bus.emit('gameover', {});
      else if (!State.s.flags.intro) { await Cutscene.play('intro'); State.s.flags.intro = true; State.save(); }
      if (showLoaded && !Rules.isGameOver(State.s)) UI.toast({ icon: '💾', title: 'Spielstand geladen', text: `Willkommen zurück. ${UI.fmt(State.s.balance)} in der Tasche.` });
      return;
    }
    if (typeof Story !== 'undefined') await Story.enter(choice);
    else { UI.toast({ icon: '🚧', title: 'Story kommt noch', tone: 'info' }); await Modes.enter('free'); }
  },
};
</script>

<script id="story-engine">
/* ================= STORY ENGINE – Tage, Sperren, Szenen, Enden ================= */
const Stories = {
  all: {},
  define(story) {
    for (const [id, panels] of Object.entries(story.scenes || {})) Cutscene.define(id, panels);
    this.all[story.id] = story;
  },
  get(id) { return this.all[id]; },
  list() { return Object.values(this.all).filter((s) => !s.dev); },
  runInfo() {
    const p = State.peekStory();
    if (!p) return null;
    const st = this.get(p.story.id);
    return { id: p.story.id, title: st ? st.title : p.story.id, day: p.story.day, days: st ? st.days : '?' };
  },
  validateAll() {
    const sceneIds = Object.keys(Cutscene.SCENES);
    const jobIds = typeof Jobs !== 'undefined' ? Object.keys(Jobs.POOL) : null;
    const errs = [];
    for (const st of Object.values(this.all)) errs.push(...StoryRules.validate(st, sceneIds, jobIds || (st.start.unlocked.jobs)));
    if (errs.length) { errs.forEach((e) => console.error('[story]', e)); UI.toast({ icon: '🐛', title: 'Story-Daten fehlerhaft', text: errs[0], tone: 'loss', ms: 8000 }); }
    return errs;
  },
};

const Story = {
  DOORS: ['roulette', 'slots', 'horses', 'russian', 'blackjack', 'postman'],
  ROOM_OF: { finance: ['bank', 'mafia'], invest: ['invest'], life: ['life'], vito: ['vito'] },
  story: null,
  allowOnce: null,
  lostDay: false,
  sleeping: false,
  get s() { return State.s.story; },

  /* ---- Einstieg ---- */
  async enter(choice) {
    Stories.validateAll();
    const params = new URLSearchParams(location.search);
    if (choice === 'newstory' && State.hasStoryRun() && !params.has('fresh')) {
      State.setMode('story');
      this.story = Stories.get(State.s.story.id);
      this.setup();
      const c = await Cutscene.play('story.newConfirm', {});
      if (c !== 'yes') return this.enter('story');
    }
    if (choice === 'newstory' || !State.hasStoryRun()) {
      const forced = params.get('story');
      const id = forced && Stories.get(forced) ? forced : StoryRules.pickStory(Stories.list(), State.meta.storyRuns, Math.random);
      const story = Stories.get(id);
      State.startStory(story);
      if (params.has('day') && params.has('fresh')) State.s.story.day = Math.max(1, parseInt(params.get('day'), 10) || 1);
      this.story = story;
      this.setup();
      State.save();
      if (!params.has('day')) await this.playScene(story.intro);
      await this.applyChapter();
      if (params.has('ending')) { const end = story.endings.find((e) => e.id === params.get('ending')); if (end) return this.finish(end); }
      await this.morning();
      return;
    }
    State.setMode('story');
    this.story = Stories.get(State.s.story.id);
    if (!this.story) { UI.toast({ icon: '🐛', title: 'Story unbekannt', text: State.s.story.id, tone: 'loss' }); return Modes.enter('free'); }
    this.setup();
    if (this.s.phase === 'morning') await this.morning(); else await this.evening();
    UI.toast({ icon: '📖', title: this.story.title, text: `Tag ${this.s.day} von ${this.story.days}.` });
  },
  setup() {
    document.body.classList.remove('mode-free'); document.body.classList.add('mode-story');
    UI.mountShell();
    this.renderDaybar();
  },

  /* ---- Kontext & Szenen ---- */
  ctx(extra = {}) {
    const s = State.s;
    const c = { day: this.s.day, balance: UI.fmt(s.balance) };
    for (const [k, v] of Object.entries(this.s.vars)) {
      const hud = (this.story.hud || []).find((h) => h.var === k);
      c[k] = hud && hud.fmt === 'money' ? UI.fmt(v) : String(v);
    }
    return Object.assign(c, extra);
  },
  async playScene(id, extra = {}) {
    if (!id) return undefined;
    const result = await Cutscene.play(id, this.ctx(extra));
    const panels = this.story.scenes[id] || [];
    if (result !== undefined) {
      for (const p of panels) for (const ch of p.choices || []) if (ch.value === result && ch.effects) await this.applyEffects(ch.effects);
    }
    return result;
  },
  async applyEffects(list) {
    for (const eff of list || []) {
      const out = StoryRules.applyEffect(State.s, eff, this.story);
      if (out.scene) await this.playScene(out.scene);
      if (out.force === 'duel') await this.forceDuel();
      if (out.loseDay) this.lostDay = true;
    }
    State.save();
    UI.setBalance(State.s.balance);
    UI.renderWallet(); UI.renderSide();
    this.renderDaybar();
  },
  async runEvents(at) {
    for (const e of StoryRules.dueEvents(this.story, State.s, at)) {
      if (e.once) this.s.seen.push(e.id);
      if (e.scene) await this.playScene(e.scene);
      await this.applyEffects(e.effects || []);
    }
  },
  async applyChapter() {
    const ch = StoryRules.chapterFor(this.story, State.s);
    if (!ch || ch.id === this.s.chapter) return;
    this.s.chapter = ch.id;
    const before = { jobs: [...this.s.unlocked.jobs], doors: [...this.s.unlocked.doors], rooms: [...this.s.unlocked.rooms] };
    if (ch.unlock) StoryRules.applyEffect(State.s, { unlock: (ch.unlock || {}) }, this.story);
    State.save();
    UI.toast({ icon: '📖', title: `Kapitel: ${ch.title}`, tone: 'gold', ms: 4000 });
    if (ch.intro) await this.playScene(ch.intro);
    const added = {
      jobs: this.s.unlocked.jobs.filter((j) => !before.jobs.includes(j)),
      doors: this.s.unlocked.doors.filter((d) => !before.doors.includes(d)),
      rooms: this.s.unlocked.rooms.filter((r) => !before.rooms.includes(r)),
    };
    if (added.jobs.length || added.doors.length || added.rooms.length) {
      const names = [...added.jobs.map((j) => (typeof Jobs !== 'undefined' && Jobs.POOL[j] ? Jobs.POOL[j].name : j)), ...added.doors, ...added.rooms];
      UI.toast({ icon: '🔓', title: 'Neu freigeschaltet', text: names.join(' · '), tone: 'info', ms: 5000 });
    }
    UI.renderSide(); this.renderDaybar();
  },

  /* ---- Tagesphasen ---- */
  async morning() {
    this.s.phase = 'morning'; this.lostDay = false;
    State.save(); this.renderDaybar();
    await this.runEvents('morning');
    if (this.lostDay) return this.evening();
    await UI.show(UI.screens.has('jobs') ? 'jobs' : 'hub');
  },
  async evening() {
    this.s.phase = 'evening';
    State.save(); this.renderDaybar();
    await UI.show('hub');
  },
  async night() {
    if (this.sleeping) return;
    if (this.s.phase !== 'evening' || Cutscene.active || Game.inFlight > 0) { if (Game.inFlight > 0) UI.toast({ icon: '⏳', title: 'Erst die Runde beenden' }); return; }
    this.sleeping = true;
    this.renderDaybar();
    try {
      await this.fade(`Nacht ${this.s.day}`);
      await this.runEvents('night');
      let end = StoryRules.ending(this.story, State.s);
      if (end) return this.finish(end);
      StoryRules.advanceDay(State.s);
      State.save();
      await Bus.emit('story:day', { day: this.s.day });
      end = StoryRules.ending(this.story, State.s);
      if (end) return this.finish(end);
      await this.fade(`Tag ${this.s.day}`);
      await this.applyChapter();
      await this.morning();
    } finally {
      this.sleeping = false;
    }
  },
  async finish(end) {
    this.s.ended = end.id;
    const run = State.meta.storyRuns[this.story.id] || (State.meta.storyRuns[this.story.id] = { lastPlayed: 0, endings: [] });
    if (!run.endings.includes(end.id)) run.endings.push(end.id);
    run.lastPlayed = Date.now();
    State.saveMeta(); State.save();
    const st = this.s.stats;
    const stats = { Tage: Math.min(this.s.day, this.story.days), Verdient: UI.fmt(st.earned), Verzockt: UI.fmt(st.gambled), Jobs: st.jobs, Ende: end.title };
    const panels = (this.story.scenes[end.scene] || []).map((p) => Object.assign({}, p));
    const last = panels[panels.length - 1];
    last.fx = 'stats';
    last.choices = [{ label: 'Nächste Story', value: 'next', cls: 'red' }, { label: 'Zum Titel', value: 'title', cls: 'ghost' }];
    Cutscene.define('story.ending.tmp', panels);
    const choice = await Cutscene.play('story.ending.tmp', this.ctx({ stats }));
    await Bus.emit('story:ended', { id: this.story.id, ending: end.id });
    if (choice === 'next') return this.enter('newstory');
    const c = await Title.show();
    if (c) await Modes.enter(c);
  },
  jobDone(jobId, earned) {
    this.s.jobToday = jobId;
    this.s.jobsDone[jobId] = (this.s.jobsDone[jobId] || 0) + 1;
    this.s.stats.jobs++;
    this.s.stats.earned += Math.max(0, earned);
    State.save();
    return this.evening();
  },

  /* ---- Sperren ---- */
  isLocked(screen) {
    if (State.mode !== 'story' || !this.story) return false;
    if (screen === this.allowOnce) { this.allowOnce = null; return false; }
    if (['jobs', 'vito'].includes(screen)) return false;
    if (['job-spueler', 'job-taxi'].includes(screen)) return this.s.phase !== 'morning';
    if (this.DOORS.includes(screen)) {
      if (screen === 'postman') return true; // Post ist ein Job (morgens)
      return !this.s.unlocked.doors.includes(screen);
    }
    if (this.ROOM_OF[screen]) return !this.ROOM_OF[screen].some((r) => this.s.unlocked.rooms.includes(r));
    return false;
  },
  lockReason(screen) {
    if (screen === 'postman') return 'Morgens, an der Pinnwand';
    return (this.story.lockReason || {})[screen] || 'Noch geschlossen';
  },
  roomUnlocked(room) { return State.mode !== 'story' || this.s.unlocked.rooms.includes(room); },
  decorateHub(root) {
    qsa('.door', root).forEach((d) => {
      const id = d.dataset.screen;
      if (!this.isLocked(id)) return;
      d.classList.add('locked');
      d.append(h('div', { class: 'boards' }, h('span'), h('span')));
      qs('.chalk-tag', d).textContent = this.lockReason(id);
    });
  },

  /* ---- HUD ---- */
  hudNotes() {
    return (this.story.hud || []).map((hd) => {
      const v = this.s.vars[hd.var] || 0;
      const txt = hd.fmt === 'money' ? UI.fmt(v) : (hd.max ? `${v}/${hd.max}` : String(v));
      return h('span', { class: `note ${hd.tone || 'gold'}` }, `${hd.label} ${txt}`);
    });
  },
  renderDaybar() {
    const slot = qs('#daybarSlot');
    if (State.mode !== 'story' || !this.story) { slot.innerHTML = ''; return; }
    if (!qs('.daybar', slot)) {
      slot.appendChild(qs('#tpl-daybar').content.cloneNode(true));
      qs('#btnSleep', slot).addEventListener('click', () => { SFX.play('click'); Story.night(); });
      qs('#btnTitleBack', slot).addEventListener('click', () => Title.open());
      qs('#btnBoard', slot).addEventListener('click', () => { SFX.play('click'); UI.show('jobs'); });
    }
    qs('#dayNum', slot).textContent = this.s.day;
    qs('#dayMax', slot).textContent = this.story.days;
    qs('#phaseMorning', slot).classList.toggle('on', this.s.phase === 'morning');
    qs('#phaseEvening', slot).classList.toggle('on', this.s.phase === 'evening');
    qs('#btnSleep', slot).disabled = this.s.phase !== 'evening' || this.sleeping;
    qs('#btnBoard', slot).classList.toggle('hidden', this.s.phase !== 'morning');
    qs('#dayGoal', slot).textContent = this.story.goal ? this.story.goal(State.s) : '';
  },
  fade(text) {
    const el = qs('#nightfade');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.textContent = text;
    el.classList.add('on');
    return wait(reduced ? 300 : 1100).then(() => { el.classList.remove('on'); return wait(reduced ? 50 : 350); });
  },

  /* ---- Erzwungenes Duell ---- */
  async forceDuel() {
    this.allowOnce = 'russian';
    await UI.show('russian');
    const victim = await new Promise((resolve) => {
      const off = Bus.on('rr:forced', ({ victim: v }) => { off(); resolve(v); });
      Russian.start({ forced: true });
    });
    this.s.flags[victim === 'igor' ? 'duelWon' : 'duelLost'] = true;
    State.save();
    await wait(800);
    return victim;
  },
};

<script id="jobs">
/* ================= JOBS – Pinnwand, Schicht-Karten ================= */
const Jobs = {
  POOL: {
    spueler: { id: 'spueler', name: 'Spüler', icon: '🍽️', kind: 'game', screen: 'job-spueler', desc: 'Teller im Takt vom Band. 5 € pro Teller, Bruch kostet 10 €.', pay: '0–50 €' },

    taxi: { id: 'taxi', name: 'Nachttaxi', icon: '🚕', kind: 'game', screen: 'job-taxi', desc: '60 Sekunden, drei Spuren. Fahrgäste einsammeln, bei Rot bremsen.', pay: 'bis 300 €', requires: { balance: { gte: 200 } }, requireText: 'Kaution 200 €' },
    tuersteher: { id: 'tuersteher', name: 'Türsteher', icon: '🚪', kind: 'shift', base: 100, desc: 'Wer kommt rein, wer nicht. Vito guckt zu.', pay: '100 € + Trinkgeld' },
    croupier: { id: 'croupier', name: 'Croupier', icon: '🃏', kind: 'shift', base: 150, requires: { jobDone: 'tuersteher', gte: 3 }, requireText: '3 Nächte als Türsteher', desc: 'Karten geben, Kessel drehen, Mund halten.', pay: '150 €' },
    kurier: { id: 'kurier', name: 'Kevins Kurier', icon: '💊', kind: 'shift', base: 300, desc: 'Päckchen von A nach B. Frag nicht, was drin ist.', pay: '300 €' },
    praktikant: { id: 'praktikant', name: 'Praktikant bei Krause', icon: '👔', kind: 'shift', base: 120, desc: 'Kaffee kochen, Akten lesen. Manche Akten sind interessant.', pay: '120 €' },
    docassi: { id: 'docassi', name: 'Assistent beim Doc', icon: '🩺', kind: 'shift', base: 250, desc: 'Handschuhe an. Nicht hinsehen.', pay: '250 €' },
  },
  render(root) {
    const board = qs('#pinboard', root);
    board.innerHTML = '';
    const s = State.s;
    for (const job of Object.values(this.POOL)) {
      if (!s.story.unlocked.jobs.includes(job.id)) continue;
      const av = StoryRules.jobAvailable(job, s);
      const note = h('div', { class: 'jobnote' + (av.ok ? '' : av.reason === 'done' ? ' done' : ' locked') },
        h('h4', {}, job.icon, job.name), h('p', {}, job.desc), h('div', { class: 'pay' }, job.pay));
      if (!av.ok && av.reason !== 'done') note.append(h('div', { class: 'why' }, av.reason === 'locked' ? 'Gesperrt' : av.reason));
      if (av.reason === 'done') note.append(h('div', { class: 'done-stamp' }, 'Heute erledigt'));
      if (av.ok) note.addEventListener('click', () => { SFX.play('stamp'); Jobs.take(job.id); });
      board.append(note);
    }
    if (!board.children.length) board.append(h('p', { class: 'paper' }, 'Nichts an der Pinnwand. Komm morgen wieder.'));
  },
  async take(id) {
    const job = this.POOL[id];
    if (!job || !StoryRules.jobAvailable(job, State.s).ok) return;
    if (job.kind === 'game') {
      if (!UI.screens.has(job.screen)) { UI.toast({ icon: '🚧', title: 'Job noch nicht verfügbar', tone: 'info' }); return; }
      Story.jobStart = { id, balance: State.s.balance };
      Story.allowOnce = job.screen;
      await UI.show(job.screen);
      return;
    }
    await this.runShift(job);
  },
  async runShift(job) {
    const list = (Story.story.jobScenes || {})[job.id] || [];
    const seen = Story.s.seenJobScenes[job.id] || (Story.s.seenJobScenes[job.id] = []);
    let cands = list.filter((sid) => !seen.includes(sid));
    if (!cands.length && list.length) { seen.length = 0; cands = list.slice(); }
    const sceneId = cands.length ? pick(cands) : null;
    if (sceneId) seen.push(sceneId);
    const before = State.s.balance;
    Game.applyDelta(job.base, { quiet: true });
    UI.toast({ icon: job.icon, title: `${job.name}: Schicht`, text: `+${UI.fmt(job.base)} Lohn.`, tone: 'win' });
    if (sceneId) await Story.playScene(sceneId);
    const earned = State.s.balance - before;
    await Bus.emit('job:done', { id: job.id, earned });
    await Story.jobDone(job.id, earned);
    if (Story.lostDay) { Story.lostDay = false; UI.toast({ icon: '🚔', title: 'Tag verloren', text: 'Der Abend fällt aus.', tone: 'loss' }); await Story.night(); }
  },
  async finishGame(id) {
    const start = Story.jobStart;
    Story.jobStart = null;
    const earned = start ? State.s.balance - start.balance : 0;
    await Bus.emit('job:done', { id, earned });
    await Story.jobDone(id, earned);
  },
  abort() { Story.jobStart = null; },
};

<script id="job-spueler">
/* ================= JOB: SPÜLER – Timing am Band ================= */
const Spueler = {
  root: null, gen: 0, running: false, raf: null, plate: 0, hits: 0, breaks: 0, pos: 0, t0: 0, dur: 1600, zone: { c: 0.5, w: 0.3 }, resolved: false,
  TOTAL: 10,
  alive(gen) { return !!this.root && this.gen === gen; },
  start() {
    if (this.running || !this.root) return;
    this.running = true; this.plate = 0; this.hits = 0; this.breaks = 0;
    qs('#btnDishStart', this.root).classList.add('hidden');
    qs('#btnDishTap', this.root).classList.remove('hidden');
    qs('#belt', this.root).classList.add('running');
    qs('#dishStatus', this.root).textContent = 'Los!';
    this.nextPlate();
  },
  nextPlate() {
    const gen = this.gen;
    if (!this.alive(gen) || !this.running) return;
    if (this.plate >= this.TOTAL) return this.finish();
    this.plate++;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const k = (this.plate - 1) / (this.TOTAL - 1);
    this.dur = reduced ? 1800 : Math.round(1600 - k * 700);          // 1600 → 900 ms
    this.zone = { c: rand(0.35, 0.75), w: reduced ? 0.3 : 0.3 - k * 0.18 }; // 30 % → 12 %
    this.resolved = false;
    const zone = qs('#dishZone', this.root), plate = qs('#dishPlate', this.root);
    zone.style.left = `${(this.zone.c - this.zone.w / 2) * 100}%`; zone.style.width = `${this.zone.w * 100}%`;
    plate.className = 'plate'; plate.style.left = '0%';
    qs('#dishNum', this.root).textContent = `Teller ${this.plate}/${this.TOTAL}`;
    this.t0 = performance.now();
    const step = (now) => {
      if (!this.alive(gen) || !this.running || this.resolved) return;
      this.pos = Math.min(1, (now - this.t0) / this.dur);
      plate.style.left = `${this.pos * 100}%`;
      if (this.pos >= 1) { this.miss('Runtergefallen!'); return; }
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  tap() {
    if (!this.running || this.resolved || !this.root) return;
    const inZone = Math.abs(this.pos - this.zone.c) <= this.zone.w / 2;
    if (inZone) {
      this.resolved = true; this.hits++;
      qs('#dishPlate', this.root).classList.add('hit');
      SFX.play('coin');
      qs('#dishStatus', this.root).innerHTML = '<span class="win">Sauber!</span>';
      this.score();
      setTimeout(() => this.nextPlate(), 380);
    } else {
      this.miss('Daneben – Bruch!');
    }
  },
  miss(msg) {
    this.resolved = true; this.breaks++;
    if (this.root) {
      qs('#dishPlate', this.root).classList.add('broken');
      qs('#dishStatus', this.root).innerHTML = `<span class="loss">${msg}</span>`;
      UI.shake(qs('#belt', this.root));
    }
    SFX.play('lose');
    this.score();
    setTimeout(() => this.nextPlate(), 520);
  },
  score() { if (this.root) qs('#dishScore', this.root).textContent = `Sauber ${this.hits} · Bruch ${this.breaks}`; },
  async finish() {
    this.running = false;
    const pay = Math.max(StoryRules.spuelerPay(this.hits, this.breaks), -State.s.balance);
    if (this.root) {
      qs('#belt', this.root).classList.remove('running');
      qs('#btnDishTap', this.root).classList.add('hidden');
      qs('#btnDishDone', this.root).classList.remove('hidden');
      qs('#dishStatus', this.root).innerHTML = pay >= 0 ? `<span class="win">Schicht vorbei · ${this.hits} sauber · Lohn ${UI.fmt(pay)}</span>` : `<span class="loss">Schicht vorbei · ${this.breaks} Bruch · Abzug ${UI.fmt(-pay)}</span>`;
    }
    if (pay !== 0) Game.applyDelta(pay, { from: this.root ? qs('#belt', this.root) : null });
    if (pay >= 0) SFX.play('cash');
    await Bus.emit('spueler:result', { hits: this.hits, breaks: this.breaks, pay });
  },
  onKey(e) { if (e.code === 'Space' && qs('#cutscene').hidden && !e.repeat) { e.preventDefault(); Spueler.tap(); } },
};
UI.register('job-spueler', {
  template: 'tpl-job-spueler',
  mount(root) {
    Spueler.root = root; Spueler.gen++; Spueler.running = false;
    qs('#btnDishStart', root).addEventListener('click', () => { SFX.play('click'); Spueler.start(); });
    qs('#btnDishTap', root).addEventListener('click', () => Spueler.tap());
    qs('#belt', root).addEventListener('pointerdown', () => Spueler.tap());
    qs('#btnDishDone', root).addEventListener('click', () => { SFX.play('click'); Jobs.finishGame('spueler'); });
    document.addEventListener('keydown', Spueler.onKey);
  },
  unmount() {
    document.removeEventListener('keydown', Spueler.onKey);
    if (Spueler.raf) cancelAnimationFrame(Spueler.raf);
    if (Spueler.running) Jobs.abort();
    Spueler.gen++; Spueler.root = null; Spueler.running = false;
  },
});
</script>

<script id="selftest">
/* ================= SELFTEST – läuft mit ?selftest im Browser und via node tests/run-selftest.mjs ================= */
const SelfTest = {
  cases: [],
  test(name, fn) { this.cases.push({ name, fn }); },
  eq(a, b, msg = '') {
    const ja = JSON.stringify(a), jb = JSON.stringify(b);
    if (ja !== jb) throw new Error(`${msg} erwartet ${jb}, bekommen ${ja}`);
  },
  ok(v, msg = 'erwartet wahr') { if (!v) throw new Error(msg); },
  run() {
    let passed = 0, failed = 0; const failures = [];
    for (const c of this.cases) {
      try { c.fn(); passed++; } catch (e) { failed++; failures.push(`${c.name}: ${e.message}`); }
    }
    return { passed, failed, failures };
  },
};
/* deterministischer rng: liefert die Werte der Reihe nach, dann von vorn */
const seq = (...vals) => { let i = 0; return () => vals[i++ % vals.length]; };
const T = SelfTest;

/* ---- Rules: Wirtschaft ---- */
const base = (o = {}) => Object.assign({
  balance: 50, beers: 0, beerTimer: 0, brownieTimer: 0, kidneySold: false,
  bankDebt: 0, mafiaDebt: 0, hasHouse: false, hasDealer: false,
  isMarried: false, isHeartbroken: false,
}, o);

T.test('luck: nichts aktiv = 0', () => T.eq(Rules.luck(base()), 0));
T.test('luck: 1/2/3 Bier = 10/15/20', () => {
  T.eq(Rules.luck(base({ beers: 1, beerTimer: 2 })), 10);
  T.eq(Rules.luck(base({ beers: 2, beerTimer: 1 })), 15);
  T.eq(Rules.luck(base({ beers: 3, beerTimer: 2 })), 20);
});
T.test('luck: Bier ohne Timer zählt nicht', () => T.eq(Rules.luck(base({ beers: 2, beerTimer: 0 })), 0));
T.test('luck: Brownie +40, mit 3 Bier 60', () => {
  T.eq(Rules.luck(base({ brownieTimer: 1 })), 40);
  T.eq(Rules.luck(base({ beers: 3, beerTimer: 2, brownieTimer: 1 })), 60);
});
T.test('bankInterest: 30% gerundet', () => {
  T.eq(Rules.bankInterest(0), 0);
  T.eq(Rules.bankInterest(200), 60);
  T.eq(Rules.bankInterest(1000), 300);
  T.eq(Rules.bankInterest(333), 100);
});
T.test('spinCosts: Zinsen + Meds', () => {
  T.eq(Rules.spinCosts(base()), { interest: 0, meds: 0 });
  T.eq(Rules.spinCosts(base({ bankDebt: 200, kidneySold: true })), { interest: 60, meds: 20 });
});
T.test('maxBet: Guthaben minus Kosten, mindestens 1', () => {
  T.eq(Rules.maxBet(base()), 50);
  T.eq(Rules.maxBet(base({ bankDebt: 200, kidneySold: true })), 1);
  T.eq(Rules.maxBet(base({ balance: 500, bankDebt: 200 })), 440);
});
T.test('checkSpin: ungültiger Einsatz', () => {
  T.eq(Rules.checkSpin(base(), 0).ok, false);
  T.eq(Rules.checkSpin(base(), 0).reason, 'invalid');
  T.eq(Rules.checkSpin(base(), NaN).ok, false);
  T.eq(Rules.checkSpin(base(), -5).ok, false);
});
T.test('checkSpin: zu wenig Geld inkl. Kosten', () => {
  const r = Rules.checkSpin(base({ balance: 80, bankDebt: 200, kidneySold: true }), 10);
  T.eq(r, { ok: false, reason: 'funds', total: 90, interest: 60, meds: 20 });
});
T.test('checkSpin: ok', () => {
  T.eq(Rules.checkSpin(base({ balance: 100, bankDebt: 200, kidneySold: true }), 10), { ok: true, total: 90, interest: 60, meds: 20 });
  T.eq(Rules.checkSpin(base(), 50).ok, true);
  T.eq(Rules.checkSpin(base(), 51).ok, false);
});
T.test('mafiaBill = 3x', () => T.eq(Rules.mafiaBill(300), 900));
T.test('bankLoanAllowed: Limit 3000', () => {
  T.eq(Rules.bankLoanAllowed(base({ bankDebt: 2000 }), 1000), true);
  T.eq(Rules.bankLoanAllowed(base({ bankDebt: 2500 }), 1000), false);
  T.eq(Rules.bankLoanAllowed(base({ bankDebt: 3000 }), 200), false);
});
T.test('isGameOver: beide Quellen zu und kein Spin mehr bezahlbar', () => {
  T.eq(Rules.isGameOver(base({ balance: -10, bankDebt: 3000, mafiaDebt: 300 })), true);
  T.eq(Rules.isGameOver(base({ balance: 901, bankDebt: 3000, mafiaDebt: 300 })), false); // 1 € + 900 € Zinsen reicht genau
  T.eq(Rules.isGameOver(base({ balance: -10, bankDebt: 2000, mafiaDebt: 300 })), false);
