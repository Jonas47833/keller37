    if (!free && !RoyalRules.MEGA.BETS.includes(bet)) { UI.toast({ icon: '🎰', title: 'Einsatz', text: 'Hier gilt 100, 250, 500 oder 1.000 €.', tone: 'loss' }); return; }
    /* Freispiel: kein Einsatz, kein beginSpin (checkSpin verlangt bet > 0) – nur die Runde als laufend markieren; settle() räumt sie wieder ab */
    if (free) { if (Game.settling) return; Game.inFlight++; }
    else if (!Game.beginSpin(bet)) return;
    const run = State.s, gen = this.gen;
    this.spinning = true;
    try {
      qs('#btnMega', this.root).disabled = true;
      if (free) this.freeLeft--;
      this.lastBet = bet;
      qs('#megaStatus', this.root).textContent = free ? 'Freispiel läuft…' : 'Walzen laufen…';
      qs('#megaLines', this.root).textContent = '';
      let grid = RoyalRules.megaRoll(Math.random);
      const mods = Perks.mods();
      grid = RoyalRules.megaLuckOverride(grid, Rules.effectiveLuck(Rules.luck(State.s, mods), bet), Math.random);
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const shown = RoyalRules.megaRoll(Math.random);
      this.render(shown, { spin: [0, 1, 2, 3, 4] });
      SFX.loop('reelSpin', 120);
      const stops = reduced ? [100, 150, 200, 250, 300] : [700, 1050, 1400, 1750, 2100];
      for (let i = 0; i < 5; i++) {
        await wait(stops[i] - (i ? stops[i - 1] : 0));
        if (!this.alive(gen)) break;
        shown[i] = grid[i];
        this.render(shown, { spin: [1, 2, 3, 4].filter((k) => k > i) });
        SFX.play('reelStop');
      }
      SFX.stop('reelSpin');
      const w = RoyalRules.megaWin(grid, bet, free);
      const delta = RoyalRules.megaDelta(bet, w.payout, free);
      if (w.freeSpins) { this.freeLeft = Math.min(RoyalRules.MEGA.FREE_MAX, this.freeLeft + w.freeSpins); this.freeRun = run; }
      if (this.alive(gen)) {
        this.markHits(w.lines);
        qs('#megaLines', this.root).textContent = w.lines.map((l) => `Linie ${l.line + 1}: ${this.cellText(l.sym)} ×${l.count} → ${l.mult}×`).join(' · ') + (w.scatters >= 3 ? `${w.lines.length ? ' · ' : ''}⭐×${w.scatters}: +${w.freeSpins} Freispiele` : '');
        const st = qs('#megaStatus', this.root);
        st.innerHTML = w.payout > 0 ? `<span class="win">Auszahlung ${UI.fmt(w.payout)}${free ? ' (Freispiel ×2)' : ''}</span>` : `<span class="loss">${free ? 'Freispiel · nichts' : `Niete · −${UI.fmt(bet)}`}</span>`;
        this.syncFree();
      }
      if (w.lines.some((l) => l.sym === '7️⃣' && l.count === 5)) Achievements.unlock('fuenfSiebener');
      await Bus.emit('megaslots:result', { delta, bet: free ? 0 : bet, detail: { grid, lines: w.lines, scatters: w.scatters, free, freeLeft: this.freeLeft } });
      await Game.settle(delta, { from: this.alive(gen) ? qs('.mega-machine', this.root) : null, game: 'megaslots', bet: free ? 0 : bet, run });
    } finally {
      SFX.stop('reelSpin');
      if (this.gen === gen) { this.spinning = false; const b = qs('#btnMega', this.root); if (b) b.disabled = false; this.syncFree(); }
    }
  },
  onKey(e) { if (e.code === 'Space' && qs('#cutscene').hidden && !e.repeat) { e.preventDefault(); MegaSlots.spin(); } },
};
UI.register('megaslots', {
  template: 'tpl-megaslots',
  mount(root) {
    MegaSlots.gen++; MegaSlots.root = root;
    MegaSlots.render([['🍒', '7️⃣', '💎'], ['🔔', '7️⃣', 'BAR'], ['💎', '7️⃣', '🍒'], ['BAR', '7️⃣', '🔔'], ['🍒', '7️⃣', '💎']]);
    Game.bindBet(root, 'megaBet');
    qs('#btnMega', root).addEventListener('click', () => MegaSlots.spin());
    qs('#megaBack', root).addEventListener('click', () => { SFX.play('click'); UI.show('royal'); });
    document.addEventListener('keydown', MegaSlots.onKey);
    MegaSlots.syncFree();
  },
  unmount() { MegaSlots.gen++; document.removeEventListener('keydown', MegaSlots.onKey); SFX.stop('reelSpin'); MegaSlots.root = null; MegaSlots.spinning = false; },
});
/* ---- Craps ---- */
const Craps = {
  root: null, rolling: false, gen: 0, point: null, bets: { pass: 0, field: 0 }, history: [], run: null,
  FACES: ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'],
  alive(gen) { return !!this.root && this.gen === gen; },
  /* Tischzustand gehört zum Spielstand: anderer State.s (Moduswechsel, Neues Spiel) → Tisch räumen */
  checkRun() { if (this.run !== State.s) { this.reset(); this.render(); } },
  place(kind) {
    if (this.rolling || !this.root) return;
    this.checkRun();
    const v = Game.readBet('crapsBet');
    if (!(v >= RoyalRules.CRAPS.MIN && v <= RoyalRules.CRAPS.MAX)) { UI.toast({ icon: '🎲', title: 'Einsatz', text: `Zwischen ${UI.fmt(RoyalRules.CRAPS.MIN)} und ${UI.fmt(RoyalRules.CRAPS.MAX)}.`, tone: 'loss' }); return; }
    if (kind === 'pass' && this.point != null) { UI.toast({ icon: '🎲', title: 'Punkt läuft', text: 'Pass Line erst nach der Entscheidung.', tone: 'loss' }); return; }
    this.bets[kind] = Math.min(RoyalRules.CRAPS.MAX, this.bets[kind] + v);
    this.run = State.s;
    SFX.play('chip'); this.render();
  },
  /* Leeren: während ein Punkt läuft, bleibt der Pass-Einsatz auf dem Tisch (nur Field wird zurückgenommen) */
  clear() { if (this.rolling || !this.root) return; if (this.point != null) this.bets.field = 0; else this.bets = { pass: 0, field: 0 }; SFX.play('click'); this.render(); },
  reset() { this.point = null; this.bets = { pass: 0, field: 0 }; this.history = []; this.run = null; },
  render() {
    if (!this.root) return;
    qs('#passAmt', this.root).textContent = UI.fmt(this.bets.pass);
    qs('#fieldAmt', this.root).textContent = UI.fmt(this.bets.field);
    const p = qs('#crapsPoint', this.root); p.textContent = this.point == null ? 'Come-out' : `Punkt ${this.point}`; p.classList.toggle('on', this.point != null);
    qs('#crapsHistory', this.root).textContent = this.history.slice(-10).join(' · ');
    qs('#btnPass', this.root).disabled = this.point != null;
    qs('#btnRoll', this.root).disabled = this.rolling || (this.bets.pass + this.bets.field) === 0;
  },
  async roll() {
    if (this.rolling || !this.root) return;
    this.checkRun();
    /* Schnappschuss der Einsätze: abgerechnet wird genau das, was treuhänderisch abgezogen wurde – auch wenn place() nach einem Remount währenddessen wieder freigegeben ist */
    const bets = { ...this.bets }, point = this.point;
    const risk = bets.pass + bets.field;
    if (risk === 0) return;
    /* Jeder Wurf ist ein Spin: Pass + Field werden treuhänderisch abgezogen; settle() zahlt delta + risk zurück (bei „none“ kommt der Pass-Einsatz zurück und wird beim nächsten Wurf erneut riskiert) */
    if (!Game.beginSpin(risk)) return;
    const run = Game.run, gen = this.gen;
    this.rolling = true; this.render();
    try {
      qsa('.craps-bet', this.root).forEach((b) => b.classList.remove('won', 'lost'));
      qsa('.die', this.root).forEach((d) => d.classList.add('rolling'));
      qs('#crapsStatus', this.root).textContent = 'Die Würfel rollen…';
      SFX.loop('reelSpin', 100);
      let dice = RoyalRules.crapsRoll(Math.random);
      const mods = Perks.mods();
      dice = RoyalRules.crapsLuckOverride(dice, point, bets.pass > 0, Rules.effectiveLuck(Rules.luck(State.s, mods), risk), Math.random, bets.field > 0);
      await wait(matchMedia('(prefers-reduced-motion: reduce)').matches ? 150 : 900);
      SFX.stop('reelSpin');
      const r = RoyalRules.crapsSettle(bets, point, dice);
      this.history.push(`${dice[0]}+${dice[1]}=${r.sum}`);
      this.point = r.point;
      /* Rest-Einsatz aus dem Schnappschuss, nicht aus dem Live-Objekt (zwischenzeitlich Gesetztes wurde nie abgezogen und verfällt) */
      this.bets.pass = (r.pass === 'win' || r.pass === 'lose') ? 0 : bets.pass;
      this.bets.field = 0;
      if (this.alive(gen)) {
        qsa('.die', this.root).forEach((d) => d.classList.remove('rolling'));
        qs('#die1', this.root).textContent = this.FACES[dice[0]]; qs('#die2', this.root).textContent = this.FACES[dice[1]];
        SFX.play('reelStop');
        if (r.pass === 'win') qs('#passBox', this.root).classList.add('won'); if (r.pass === 'lose') qs('#passBox', this.root).classList.add('lost');
        if (r.field === 'win') qs('#fieldBox', this.root).classList.add('won'); if (r.field === 'lose') qs('#fieldBox', this.root).classList.add('lost');
        const txt = [];
        if (r.pass === 'point') txt.push(`Punkt ist ${r.point}`); if (r.pass === 'win') txt.push('Pass gewinnt'); if (r.pass === 'lose') txt.push(r.sum === 7 ? 'Seven out' : 'Craps');
        if (r.field === 'win') txt.push(`Field ${RoyalRules.crapsField(r.sum) === 2 ? 'doppelt' : 'gewinnt'}`); if (r.field === 'lose') txt.push('Field verliert');
        qs('#crapsStatus', this.root).innerHTML = `<span class="${r.delta > 0 ? 'win' : r.delta < 0 ? 'loss' : ''}">${txt.join(' · ') || 'Weiter'} (${r.delta >= 0 ? '+' : '−'}${UI.fmt(Math.abs(r.delta))})</span>`;
        this.render();
      }
      await Bus.emit('craps:result', { delta: r.delta, bet: risk, detail: { dice, sum: r.sum, pass: r.pass, field: r.field, point: r.point, bets } });
      await Game.settle(r.delta, { from: this.alive(gen) ? qs('.craps-table', this.root) : null, game: 'craps', bet: risk, run });
    } finally {
      SFX.stop('reelSpin');
      if (this.gen === gen) { this.rolling = false; this.render(); }
    }
  },
  onKey(e) { if (e.code === 'Space' && qs('#cutscene').hidden && !e.repeat) { e.preventDefault(); Craps.roll(); } },
};
UI.register('craps', {
  template: 'tpl-craps',
  mount(root) {
    Craps.gen++; Craps.root = root;
    if (Craps.run !== State.s) Craps.reset();
    Game.bindBet(root, 'crapsBet');
    qs('#btnPass', root).addEventListener('click', () => Craps.place('pass'));
    qs('#btnField', root).addEventListener('click', () => Craps.place('field'));
    qs('#btnClearCraps', root).addEventListener('click', () => Craps.clear());
    qs('#btnRoll', root).addEventListener('click', () => Craps.roll());
    qs('#crapsBack', root).addEventListener('click', () => { SFX.play('click'); UI.show('royal'); });
    document.addEventListener('keydown', Craps.onKey);
    Craps.render();
  },
  unmount() { Craps.gen++; document.removeEventListener('keydown', Craps.onKey); SFX.stop('reelSpin'); Craps.root = null; Craps.rolling = false; },
});
/* ---- Glücksrad ---- */
const Wheel = {
  root: null, spinning: false, gen: 0, turns: 0,
  COLORS: { 0: '#2a2a2e', 0.5: '#5a3a12', 1: '#1f8a4c', 2: '#1e6fb3', 5: '#b066ff', 10: '#b3261e' },
  alive(gen) { return !!this.root && this.gen === gen; },
  label(m) { return m === 0 ? 'BANKROTT' : m === 0.5 ? 'HÄLFTE' : `×${m}`; },
  build() {
    const el = qs('#wheel', this.root); if (!el) return;
    const S = RoyalRules.WHEEL.SEGMENTS, n = S.length, step = 360 / n;
    el.style.background = `conic-gradient(${S.map((m, i) => `${this.COLORS[m]} ${i * step}deg ${(i + 1) * step}deg`).join(', ')})`;
    el.innerHTML = '';
    /* Beschriftung: unrotiert zeigt .seg nach rechts (90° im Uhrzeigersinn von oben), daher −90 */
    S.forEach((m, i) => el.append(h('div', { class: 'seg', style: `transform: rotate(${i * step + step / 2 - 90}deg)` }, this.label(m))));
  },
  /* Zeiger steht oben (0°). Segment i liegt im conic-gradient bei i*step … (i+1)*step im Uhrzeigersinn ab oben, Mitte bei i*step + step/2.
     rotate(R) dreht das Rad im Uhrzeigersinn, ein Punkt bei Winkel a landet bei a + R. Damit die Segmentmitte unter dem Zeiger liegt: R = −(i*step + step/2). */
  angleFor(index) { const step = 360 / RoyalRules.WHEEL.SEGMENTS.length; return -(index * step + step / 2); },
  async spin() {
    if (this.spinning || !this.root) return;
    const bet = Game.readBet('wheelBet');
    if (!RoyalRules.WHEEL.BETS.includes(bet)) { UI.toast({ icon: '🎡', title: 'Einsatz', text: 'Hier gilt 100, 500, 1.000 oder 5.000 €.', tone: 'loss' }); return; }
    if (!Game.beginSpin(bet)) return;
    const run = Game.run, gen = this.gen;
    this.spinning = true;
    try {
      qs('#btnWheel', this.root).disabled = true;
      qs('#wheelStatus', this.root).textContent = 'Das Rad dreht…';
      let index = RoyalRules.wheelSpin(Math.random);
      const mods = Perks.mods();
      index = RoyalRules.wheelLuckOverride(index, Rules.effectiveLuck(Rules.luck(State.s, mods), bet), Math.random);
      const el = qs('#wheel', this.root);
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      this.turns += reduced ? 1 : 5;
      el.classList.remove('hit');
      el.classList.toggle('snap', reduced);
      el.style.transform = `rotate(${this.turns * 360 + this.angleFor(index)}deg)`;
      if (!reduced) { let n = 0; const t = setInterval(() => { if (!this.alive(gen) || ++n > 28) return clearInterval(t); SFX.play('click'); }, 150); }
      await wait(reduced ? 200 : 4600);
      const mult = RoyalRules.WHEEL.SEGMENTS[index];
      const delta = RoyalRules.wheelDelta(index, bet);
      if (this.alive(gen)) {
        void el.offsetWidth; if (mult >= 1) el.classList.add('hit');
        qs('#wheelStatus', this.root).innerHTML = mult === 0 ? `<span class="loss">BANKROTT · −${UI.fmt(bet)}</span>` : mult === 0.5 ? `<span class="loss">Hälfte zurück · −${UI.fmt(bet - RoyalRules.wheelPayout(index, bet))}</span>` : mult === 1 ? 'Einsatz zurück' : `<span class="win">×${mult} · +${UI.fmt(delta)}</span>`;
        SFX.play(mult >= 2 ? 'cash' : mult === 0 ? 'lose' : 'reelStop');
      }
      if (mult === 0 && bet === 5000) Achievements.unlock('gegenDieWand');
      await Bus.emit('wheel:result', { delta, bet, detail: { index, mult } });
      await Game.settle(delta, { from: this.alive(gen) ? qs('.wheel-stage', this.root) : null, game: 'wheel', bet, run });
    } finally {
      if (this.gen === gen) { this.spinning = false; const b = qs('#btnWheel', this.root); if (b) b.disabled = false; }
    }
  },
  onKey(e) { if (e.code === 'Space' && qs('#cutscene').hidden && !e.repeat) { e.preventDefault(); Wheel.spin(); } },
};
UI.register('wheel', {
  template: 'tpl-wheel',
  mount(root) {
    Wheel.gen++; Wheel.root = root; Wheel.turns = 0; Wheel.build();
    Game.bindBet(root, 'wheelBet');
    qs('#btnWheel', root).addEventListener('click', () => Wheel.spin());
    qs('#wheelBack', root).addEventListener('click', () => { SFX.play('click'); UI.show('royal'); });
    document.addEventListener('keydown', Wheel.onKey);
  },
  unmount() { Wheel.gen++; document.removeEventListener('keydown', Wheel.onKey); Wheel.root = null; Wheel.spinning = false; },
});
/* Neustart / Tagesende: Freispiele verfallen, die Tische werden geräumt */
Bus.on('gameover:restart', () => { MegaSlots.freeLeft = 0; MegaSlots.freeRun = null; Craps.reset(); });
Bus.on('story:day', () => { MegaSlots.freeLeft = 0; MegaSlots.freeRun = null; Craps.reset(); });
</script>

<script id="game-slots">
/* ================= SLOTS ================= */
const Slots = {
  root: null,
  spinning: false,
  gen: 0,
  lastRes: null,
  lastBet: 0,
  alive(gen) { return !!this.root && this.gen === gen; },
  updateInsiderHint(bet) {
    if (!this.root) return;
    const hint = qs('#slotInsider', this.root);
    if (!hint) return;
    const mods = Perks.mods();
    if (mods.slotHoldEvery <= 0) { hint.classList.add('hidden'); hint.textContent = ''; return; }
    hint.classList.remove('hidden');
    if (!Rules.effectiveInsider(true, bet)) {
      hint.textContent = `🔧 Mechaniker: wirkt bis ${UI.fmt(Rules.INSIDER_CAP)}`;
    } else if (State.s.mechRespins >= mods.slotHoldEvery) {
      hint.textContent = '🔧 Mechaniker: bereit';
    } else {
      hint.textContent = `🔧 Mechaniker: nächster Gratisdreh in ${mods.slotHoldEvery - State.s.mechRespins} Runden`;
    }
  },
  cell() { const c = qs('.cell', this.root); return c ? c.offsetHeight : 90; },
  buildStrips() {
    qsa('.strip', this.root).forEach((strip) => {
      strip.innerHTML = '';
      for (let r = 0; r < 3; r++) for (const s of Rules.SYMBOLS) strip.append(h('div', { class: 'cell' }, s));
    });
  },
  setReel(i, sym, animate) {
    const strip = qs(`#reel${i} .strip`, this.root);
    if (!strip) return;
    const idx = Rules.SYMBOLS.indexOf(sym);
    strip.classList.remove('spinning');
    strip.style.transition = animate ? 'transform .45s cubic-bezier(.2,1.5,.4,1)' : 'none';
    strip.style.transform = `translateY(${-(6 + idx) * this.cell()}px)`;
  },
  async spin() {
    if (this.spinning || !this.root) return;
    const bet = Game.readBet('slotBet');
    if (!Game.beginSpin(bet)) return;
    const run = Game.run;
    const gen = this.gen;
    this.spinning = true;
    this.lastRes = null;
    try {
      qs('#btnSpin', this.root).disabled = true;
      qsa('.hold-btn', this.root).forEach((b) => b.classList.add('hidden'));
      const lever = qs('#lever', this.root);
      lever.classList.add('pulled');
      setTimeout(() => lever.classList.remove('pulled'), 500);
      qs('#slotStatus', this.root).textContent = 'Walzen laufen…';
      qsa('.reel-win', this.root).forEach((r) => r.classList.remove('locked', 'hit'));
      const mods = Perks.mods();
      let res = Rules.slotRoll(Math.random);
      res = Rules.slotLuckOverride(res, Rules.effectiveLuck(Rules.luck(State.s, mods), bet), Math.random);
      qsa('.strip', this.root).forEach((s, k) => { s.style.transition = 'none'; s.style.transform = 'translateY(0)'; s.style.animationDelay = `${-k * 0.13}s`; void s.offsetHeight; s.classList.add('spinning'); });
      SFX.loop('reelSpin', 120);
      [800, 1400, 2000].forEach((ms, i) => setTimeout(() => {
        if (!this.alive(gen)) return;
        this.setReel(i + 1, res[i], true);
        qs(`#reel${i + 1}`, this.root).classList.add('locked');
        SFX.play('reelStop');
        if (i === 2) SFX.stop('reelSpin');
      }, ms));
      await wait(2450);
      SFX.stop('reelSpin');
      const m = Rules.slotMultiplier(...res, mods);
      const delta = Rules.slotDelta(bet, m);
      if (mods.slotHoldEvery > 0) { State.s.mechRespins++; State.save(); }
      const canHold = m === 0 && mods.slotHoldEvery > 0 && State.s.mechRespins >= mods.slotHoldEvery && Rules.effectiveInsider(true, bet);
      if (canHold) { this.lastRes = res; this.lastBet = bet; }
      if (this.alive(gen)) {
        const stat = qs('#slotStatus', this.root);
        if (m > 0) {
          stat.innerHTML = `<span class="win">${String(m).replace('.', ',')}× · Auszahlung ${UI.fmt(Math.round(bet * m))} (${delta >= 0 ? '+' : '−'}${UI.fmt(Math.abs(delta))})</span>`;
          qsa('.reel-win', this.root).forEach((r) => r.classList.add('hit'));
          if (m >= 25) this.jackpot(m === 50 ? 'JACKPOT' : 'DIAMANTEN');
        } else {
          stat.innerHTML = `<span class="loss">Niete · −${UI.fmt(bet)}</span>`;
        }
        this.updateInsiderHint(bet);
      }
      await Bus.emit('slots:result', { res, m, bet });
      await Game.settle(delta, { from: this.alive(gen) ? qs('.slot-machine', this.root) : null, game: 'slots', bet, run });
    } finally {
      SFX.stop('reelSpin');
      if (this.gen === gen) {
        this.spinning = false;
        qs('#btnSpin', this.root).disabled = false;
        /* Erst nach der Abrechnung sichtbar, sonst kassiert ein Klick waehrend der Post-Spin-Cutscene ins Leere */
        if (this.lastRes) qsa('.hold-btn', this.root).forEach((b) => b.classList.remove('hidden'));
      }
    }
  },
  jackpot(label) {
    const machine = qs('.slot-machine', this.root);
    const sign = h('div', { class: 'jackpot neon', style: '--neon: var(--neon-amber)' }, label);
    machine.append(sign);
    setTimeout(() => sign.remove(), 2500);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (let i = 0; i < 40; i++) {
      const c = h('span', { class: 'coin-p', style: `left:${rand(5, 90)}%; top:${rand(0, 30)}%; animation-delay:${rand(0, 0.8)}s` }, pick(['🪙', '💰', '💶']));
      machine.append(c);
      setTimeout(() => c.remove(), 2600);
    }
  },
  onKey(e) { if (e.code === 'Space' && qs('#cutscene').hidden && !e.repeat) { e.preventDefault(); Slots.spin(); } },
  /* Gratisdreh des Mechanikers: keine neue Runde – kein beginSpin/settle, keine Zinsen/Meds. Nur ein Gewinn gibt XP (win). */
  async respin(k) {
    if (this.spinning || !this.root || !this.lastRes) return;
    const bet = this.lastBet, gen = this.gen, held = this.lastRes[k];
    const run = State.s; // wie Game.settle: erkennt "Neues Spiel" waehrend der 1,9s
    this.lastRes = null; State.s.mechRespins = 0; State.save();
    this.spinning = true;
    Game.inFlight++; // Gratisdreh zaehlt wie eine laufende Runde fuer Story.night()/Mugging.blocked()
    try {
      qsa('.hold-btn', this.root).forEach((b) => b.classList.add('hidden'));
      qs('#slotStatus', this.root).textContent = `Walze ${k + 1} festgehalten – Gratisdreh…`;
      const fresh = Rules.slotRoll(Math.random);
      const res = fresh.map((sym, i) => (i === k ? held : sym));
      [0, 1, 2].filter((i) => i !== k).forEach((i, j) => { const s = qs(`#reel${i + 1} .strip`, this.root); s.style.transition = 'none'; s.style.transform = 'translateY(0)'; void s.offsetHeight; s.classList.add('spinning'); setTimeout(() => { if (this.alive(gen)) { this.setReel(i + 1, res[i], true); qs(`#reel${i + 1}`, this.root).classList.add('locked'); SFX.play('reelStop'); } }, 800 + j * 600); });
      SFX.loop('reelSpin', 120);
      await wait(1900);
      SFX.stop('reelSpin');
      const m = Rules.slotMultiplier(...res, Perks.mods());
      const payout = m > 0 ? Math.round(bet * m) : 0;
      if (this.alive(gen)) qs('#slotStatus', this.root).innerHTML = payout > 0 ? `<span class="win">Gratisdreh: ${String(m).replace('.', ',')}× · +${UI.fmt(payout)}</span>` : `<span class="loss">Gratisdreh: Niete. Der Mechaniker zuckt mit den Schultern.</span>`;
      if (payout > 0 && run === State.s) { Game.applyDelta(payout, { from: this.alive(gen) ? qs('.slot-machine', this.root) : null }); SFX.play('cash'); await Bus.emit('win', { amount: payout, game: 'slots' }); }
      if (this.alive(gen)) this.updateInsiderHint(bet);
      State.save();
    } finally {
      SFX.stop('reelSpin');
      Game.inFlight = Math.max(0, Game.inFlight - 1);
      if (this.gen === gen) this.spinning = false;
    }
  },
};

UI.register('slots', {
  template: 'tpl-slots',
  mount(root) {
    Slots.gen++;
    Slots.root = root;
    Slots.lastRes = null;
    Slots.buildStrips();
    ['🍒', '7️⃣', '💎'].forEach((s, i) => Slots.setReel(i + 1, s, false));
    const mods = Perks.mods();
    qs('#payPair', root).textContent = `${String(mods.slotPairMult).replace('.', ',')}×`;
    Game.bindBet(root, 'slotBet');
    qs('#btnSpin', root).addEventListener('click', () => Slots.spin());
    qs('#lever', root).addEventListener('click', () => Slots.spin());
    qsa('.hold-btn', root).forEach((b) => b.addEventListener('click', () => {
      const k = parseInt(b.dataset.reel, 10);
      Slots.respin(k);
    }));
    Slots.updateInsiderHint(Game.readBet('slotBet'));
    document.addEventListener('keydown', Slots.onKey);
  },
  unmount() { Slots.gen++; document.removeEventListener('keydown', Slots.onKey); SFX.stop('reelSpin'); Slots.root = null; Slots.spinning = false; Slots.lastRes = null; },
});
</script>

<script id="game-blackjack">
/* ================= BLACKJACK ================= */
const Blackjack = {
  root: null, deck: [], pHand: [], dHand: [], bet: 0, dealing: false, inRound: false, gen: 0, round: null,
  alive(gen) { return !!this.root && this.gen === gen; },
  cardEl(c, hidden = false) {
    const red = ['♥', '♦'].includes(c.suit);
    return h('div', { class: `pcard dealing${hidden ? ' hidden-card' : ''}` },
      h('div', { class: 'inner' },
        h('div', { class: `face${red ? ' red' : ''}` },
          h('span', { class: 'corner tl' }, c.val, h('br'), c.suit),
          h('span', { class: 'pip' }, c.suit),
          h('span', { class: 'corner br' }, c.val, h('br'), c.suit)),
        h('div', { class: 'back' })));
  },
  async dealTo(elId, card, hidden = false) {
    if (!this.round || !this.alive(this.round.gen)) return;
    qs('#' + elId, this.root).append(this.cardEl(card, hidden));
    SFX.play('cardSlide');
    await wait(240);
  },
  updateVals(revealDealer) {
    if (!this.round || !this.alive(this.round.gen)) return;
    qs('#bjPlayerVal', this.root).textContent = Rules.handSum(this.round.pHand);
    qs('#bjDealerVal', this.root).textContent = revealDealer ? Rules.handSum(this.round.dHand) : '?';
  },
  /* Hand ohne Abrechnung fallen lassen (Screen verlassen) – Einsatz ist bereits abgezogen */
  drop(round) { if (round && !round.done) { round.done = true; Game.forfeit(); } },
  async start() {
    if (this.inRound || !this.root) return;
    const bet = Game.readBet('bjBet');
    if (!Game.beginSpin(bet)) return;
    const gen = this.gen;
    this.inRound = true; this.dealing = true; this.bet = bet;
    this.deck = Rules.newDeck(Math.random); this.pHand = []; this.dHand = [];
    const round = { pHand: this.pHand, dHand: this.dHand, deck: this.deck, bet, gen, run: Game.run, done: false };
    this.round = round;
    try {
      qs('#playerCards', this.root).innerHTML = ''; qs('#dealerCards', this.root).innerHTML = '';
      qsa('.hand-val', this.root).forEach((v) => v.classList.remove('push'));
      qs('#bjBetControls', this.root).classList.add('hidden');
      qs('#bjActionControls', this.root).classList.remove('hidden');
      qs('#bjDeckHeat', this.root).classList.add('hidden');
      qs('#bjStatus', this.root).textContent = 'Hit oder Stand?';
      round.pHand.push(round.deck.pop()); await this.dealTo('playerCards', round.pHand[0]);
      round.dHand.push(round.deck.pop()); await this.dealTo('dealerCards', round.dHand[0], true);
      round.pHand.push(round.deck.pop()); await this.dealTo('playerCards', round.pHand[1]);
      round.dHand.push(round.deck.pop()); await this.dealTo('dealerCards', round.dHand[1]);
      this.updateVals(false);
      round.natural = round.pHand.length === 2 && Rules.handSum(round.pHand) === 21;
      const mods = Perks.mods();
      round.hot = Rules.effectiveInsider(mods.bjHotDeck, bet) > 1 && Rules.deckHot(round.deck);
      if (this.alive(gen)) {
        const heat = qs('#bjDeckHeat', this.root);
        if (mods.bjHotDeck > 1) {
          heat.classList.remove('hidden');
          heat.textContent = (Rules.deckHot(round.deck) ? '🔥 Deck heiß' : '❄️ Deck kalt') + (bet > Rules.INSIDER_CAP ? ` (wirkt bis ${UI.fmt(Rules.INSIDER_CAP)})` : '');
        }
        if (round.natural) qs('#bjStatus', this.root).textContent = 'Blackjack! Stand, um zu kassieren.';
      }
    } finally {
      if (this.gen === gen) this.dealing = false;
      else this.drop(round); // Screen während des Austeilens verlassen
    }
  },
  async hit() {
    if (this.dealing || !this.inRound) return;
    const round = this.round;
    const gen = this.gen;
    this.dealing = true;
    try {
      const c = round.deck.pop();
      round.pHand.push(c);
      await this.dealTo('playerCards', c);
      this.updateVals(false);
    } finally {
      if (this.gen === gen) this.dealing = false;
    }
    if (Rules.handSum(round.pHand) > 21) await this.finish('bust', round);
    else if (!this.alive(gen)) this.drop(round); // Screen während der Karte verlassen
  },
  async stand() {
    if (this.dealing || !this.inRound) return;
    const round = this.round;
    const gen = this.gen;
    this.dealing = true;
    try {
      if (this.alive(round.gen)) {
        qs('#bjActionControls', this.root).classList.add('hidden');
        const hole = qs('#dealerCards .pcard', this.root);
        if (hole) hole.classList.remove('hidden-card');
        SFX.play('cardSlide');
        await wait(550);
        this.updateVals(true);
      }
      while (Rules.dealerShouldHit(round.dHand)) {
        const c = round.deck.pop();
        round.dHand.push(c);
        await this.dealTo('dealerCards', c);
        this.updateVals(true);
        await wait(300);
      }
    } finally {
      if (this.gen === gen) this.dealing = false;
    }
    await this.finish(Rules.bjOutcome(Rules.handSum(round.pHand), Rules.handSum(round.dHand)), round);
  },
  async finish(outcome, round) {
    if (round.done) return;
    round.done = true;
    /* bjHotDeck ist ein Insider-Bonus (im Gegensatz zu bjNatural, einem Skill) und muss daher wie
       Rules.deckHot's Anzeige über INSIDER_CAP anteilig schwächer werden, statt voll zu zahlen. */
    const mods = Object.assign({}, Perks.mods());
    mods.bjHotDeck = Rules.effectiveInsider(mods.bjHotDeck, round.bet);
    const ctx = { natural: round.natural && round.pHand.length === 2 && outcome === 'win', hot: !!round.hot };
    const delta = Rules.bjDelta(outcome, round.bet, mods, ctx);
    try {
      if (this.alive(round.gen)) {
        const winSuffix = ctx.natural ? ' (Blackjack 3:2)' : ctx.hot ? ' (heißes Deck 1,2:1)' : '';
        const pushTip = delta > 0 ? ` · +${UI.fmt(delta)} Trinkgeld` : '';
        const msgs = {
          win: `<span class="win">Gewonnen · +${UI.fmt(delta)}${winSuffix}</span>`,
          bust: `<span class="loss">Bust · über 21 · −${UI.fmt(round.bet)}</span>`,
          dealer: `<span class="loss">Dealer gewinnt · −${UI.fmt(round.bet)}</span>`,
          push: `Push · Unentschieden${pushTip}`,
        };
        qs('#bjStatus', this.root).innerHTML = msgs[outcome];
        if (outcome === 'bust') qsa('#playerCards .pcard', this.root).forEach((c) => c.classList.add('bust'));
        if (outcome === 'push') qsa('.hand-val', this.root).forEach((v) => v.classList.add('push'));
        qs('#bjActionControls', this.root).classList.add('hidden');
        qs('#bjBetControls', this.root).classList.remove('hidden');
        qs('#bjDeckHeat', this.root).classList.add('hidden'); // Lesung ist mit der Runde Geschichte
      }
    } finally {
      if (this.gen === round.gen) { this.inRound = false; this.dealing = false; }
    }
    await Bus.emit('blackjack:result', { outcome, bet: round.bet });
    await Game.settle(delta, { from: this.alive(round.gen) ? qs('#playerCards', this.root) : null, game: 'blackjack', bet: round.bet, run: round.run });
  },
};

UI.register('blackjack', {
  template: 'tpl-blackjack',
  mount(root) {
    Blackjack.gen++;
    Blackjack.root = root;
    const mods = Perks.mods();
    qs('#bjArc', root).textContent = `${mods.bjNatural === 1.5 ? 'Blackjack zahlt 3:2' : 'Blackjack zahlt 1:1'} · Dealer zieht bis 17`;
    Game.bindBet(root, 'bjBet');
    qs('#btnDeal', root).addEventListener('click', () => Blackjack.start());
    qs('#btnHit', root).addEventListener('click', () => Blackjack.hit());
    qs('#btnStand', root).addEventListener('click', () => Blackjack.stand());
  },
  unmount() {
    Blackjack.gen++;
    if (Blackjack.inRound) {
      /* Zwischen zwei Aktionen verlassen: Hand sofort fallen lassen. Läuft noch eine Kette (dealing), räumt die selbst auf. */
      if (!Blackjack.dealing) Blackjack.drop(Blackjack.round);
      UI.toast({ icon: '🃏', title: 'Hand aufgegeben', text: 'Einsatz verfallen.', tone: 'loss' });
    }
    Blackjack.root = null; Blackjack.inRound = false; Blackjack.dealing = false;
  },
});
</script>

<script id="game-roulette">
/* ================= ROULETTE ================= */
const Roulette = {
  root: null, wheelDeg: 0, spinning: false, ballRaf: null, gen: 0, bets: [], lastBets: [],
  alive(gen) { return !!this.root && this.gen === gen; },
  buildTable() {
    const t = qs('#rtable', this.root);
    t.innerHTML = '';
    // --mr/--mc: Zeile/Spalte im hochkant gedrehten Handy-Tisch (Desktop platziert automatisch)
    const cell = (label, cls, type, chosen, mr, mc) =>
      h('button', { class: `rcell ${cls}`, style: `--mr: ${mr}; --mc: ${mc}`, 'data-key': type === 'number' ? `n${chosen}` : type, onclick: (e) => this.place(type, chosen, e.currentTarget) }, label);
    t.append(cell('0', 'zero', 'number', 0, 1, '1 / -1'));
    for (let row = 0; row < 3; row++) for (let col = 0; col < 12; col++) {
      const n = col * 3 + (3 - row);
      t.append(cell(String(n), Rules.isRed(n) ? 'red' : 'black', 'number', n, col + 2, `${(n - 1) % 3 * 2 + 1} / span 2`));
    }
    t.append(cell('Rot', 'out red', 'red', null, 14, '1 / span 3'), cell('Schwarz', 'out black', 'black', null, 14, '4 / span 3'),
      cell('Gerade', 'out', 'even', null, 15, '1 / span 3'), cell('Ungerade', 'out', 'odd', null, 15, '4 / span 3'));
    this.applyExcluded();
  },
  excluded() { return Perks.mods().rouletteExclude > 0 ? (State.s.insiderExcluded || []) : []; },
  applyExcluded() {
    const ex = this.excluded();
    qsa('.rcell', this.root).forEach((c) => { const n = c.dataset.key.startsWith('n') ? parseInt(c.dataset.key.slice(1), 10) : null; c.classList.toggle('excluded', n !== null && ex.includes(n)); });
    const hint = qs('#rouletteInsider', this.root);
    hint.classList.toggle('hidden', !ex.length);
    hint.textContent = ex.length ? `👁️ Croupier-Auge: ${ex.length} Zahlen fallen nicht (wirkt bis ${UI.fmt(Rules.INSIDER_CAP)} Gesamteinsatz)` : '';
  },
  drawWheel(highlight = -1, excluded = this.excluded()) {
    const c = qs('#wheelCanvas', this.root);
    if (!c) return;
    const ctx = c.getContext('2d');
    const cx = 160, cy = 160, r = 150, total = 37, slice = (2 * Math.PI) / total;
    /* 2× Auflösung, damit der Kessel bei Zoom auf großen Bildschirmen scharf bleibt */
    if (c.width !== 640) { c.width = 640; c.height = 640; }
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.clearRect(0, 0, 320, 320);
    ctx.beginPath(); ctx.arc(cx, cy, r + 8, 0, 2 * Math.PI); ctx.fillStyle = '#4a2c14'; ctx.fill();
    for (let i = 0; i < total; i++) {
      const center = -Math.PI / 2 + i * slice;
      const num = Rules.WHEEL[i];
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, center - slice / 2, center + slice / 2); ctx.closePath();
      ctx.fillStyle = i === highlight ? '#e8c65a' : excluded.includes(num) ? '#3a3a3a' : num === 0 ? '#1f7a4d' : Rules.isRed(num) ? '#b3261e' : '#1c1c1c';
      ctx.fill();
      ctx.strokeStyle = 'rgba(201,162,39,.5)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(center); ctx.translate(r - 16, 0); ctx.rotate(Math.PI / 2);
      ctx.fillStyle = i === highlight ? '#000' : '#fff'; ctx.font = 'bold 11px "Courier Prime", "Courier New", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(num), 0, 0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx, cy, r - 32, 0, 2 * Math.PI); ctx.fillStyle = '#141712'; ctx.fill(); ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 3; ctx.stroke();
    for (let k = 0; k < 8; k++) { ctx.save(); ctx.translate(cx, cy); ctx.rotate((k * Math.PI) / 4); ctx.fillStyle = '#c9a227'; ctx.fillRect(-2, -(r - 34), 4, r - 34 - 40); ctx.restore(); }
    ctx.beginPath(); ctx.arc(cx, cy, 40, 0, 2 * Math.PI); ctx.fillStyle = '#1b1f19'; ctx.fill(); ctx.strokeStyle = '#e8c65a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, 2 * Math.PI); ctx.fillStyle = '#e8c65a'; ctx.fill();
  },
  flyChip(cell, label, gen) {
    const from = qs('#balance').getBoundingClientRect();
    const to = cell.getBoundingClientRect();
    const c = h('div', { class: 'chip fly', style: `left:${from.left}px; top:${from.top}px` }, label);
    document.body.append(c);
    void c.offsetWidth;
    c.style.transform = `translate(${to.left + to.width / 2 - from.left - 23}px, ${to.top + to.height / 2 - from.top - 23}px)`;
    setTimeout(() => { c.remove(); if (this.alive(gen) && cell.querySelector('.chip-stack')) cell.append(h('div', { class: 'chip placed' }, label)); }, 420);
  },
  animateBall(dur, gen) {
    const ball = qs('#ball', this.root);
    if (!ball) return;
    if (this.ballRaf) cancelAnimationFrame(this.ballRaf);
    const start = performance.now(), R0 = 152, R1 = 134, turns = 4;
    let lastPocket = -1;
    const frame = (now) => {
      if (!this.alive(gen)) return;
      const p = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      const angle = -90 - turns * 360 * e;           // endet bei −90° = oben, unter dem Zeiger
      let r = R0;
      if (p > 0.65) { const q = (p - 0.65) / 0.35; r = R1 + (R0 - R1) * (1 - q) * Math.abs(Math.cos(q * Math.PI * 3)); }
      const rad = (angle * Math.PI) / 180;
      ball.style.transform = `translate(${160 + r * Math.cos(rad) - 7}px, ${160 + r * Math.sin(rad) - 7}px)`;
      const pocket = Math.floor((((angle % 360) + 360) % 360) / (360 / 37));
      if (pocket !== lastPocket && p < 0.97) { lastPocket = pocket; SFX.play('ballTick'); }
      if (p < 1) this.ballRaf = requestAnimationFrame(frame); else this.ballRaf = null;
    };
    this.ballRaf = requestAnimationFrame(frame);
  },
  key(type, n) { return type === 'number' ? `n${n}` : type; },
  cellFor(type, n) { return qs(`.rcell[data-key="${this.key(type, n)}"]`, this.root); },
  total() { return Rules.rouletteTotal(this.bets); },
  renderTable(result = null) {
    if (!this.root) return;
    qsa('.chip-stack', this.root).forEach((el) => el.remove());
    const sums = new Map();
    for (const b of this.bets) { const k = this.key(b.type, b.n); sums.set(k, (sums.get(k) || 0) + b.amount); }
    for (const [k, sum] of sums) {
      const cell = qs(`.rcell[data-key="${k}"]`, this.root);
      if (!cell) continue;
      const won = result ? result.hits.some((x) => this.key(x.bet.type, x.bet.n) === k && x.win) : null;
      cell.append(h('div', { class: 'chip-stack' + (won === true ? ' won' : won === false ? ' lost' : ''), 'data-key': k }, String(sum)));
    }
    this.renderBar();
  },
  renderBar() {
    if (!this.root) return;
    qs('#tableTotal', this.root).textContent = `Auf dem Tisch: ${UI.fmt(this.total())} · ${this.bets.length} Chip${this.bets.length === 1 ? '' : 's'}`;
    const idle = !this.spinning;
    qs('#btnSpin', this.root).disabled = !idle || this.bets.length === 0;
    qs('#btnUndo', this.root).disabled = !idle || this.bets.length === 0;
    qs('#btnClear', this.root).disabled = !idle || this.bets.length === 0;
    qs('#btnRepeat', this.root).disabled = !idle || this.lastBets.length === 0 || !Rules.checkSpin(State.s, Rules.rouletteTotal(this.lastBets), Perks.mods()).ok;
  },
  place(type, n, cell) {
    if (this.spinning || !this.root) return;
    if (type === 'number' && this.excluded().includes(n)) return;
    const amount = Game.readBet('rouletteBet');
    const chk = Rules.checkSpin(State.s, this.total() + amount, Perks.mods());
    if (!chk.ok) {
      if (chk.reason === 'invalid') UI.toast({ icon: '🚫', title: 'Ungültiger Chip', text: 'Mindestens 1 €.', tone: 'loss' });
      else UI.toast({ icon: '🚫', title: 'Zu wenig Geld', tone: 'loss', ms: 4500, text: `Auf dem Tisch wären ${UI.fmt(this.total() + amount)} (+ Zinsen ${UI.fmt(chk.interest)} + Meds ${UI.fmt(chk.meds)}).` });
      SFX.play('lose');
      return;
    }
    this.bets.push({ type, n, amount });
    SFX.play('chip');
    this.flyChip(cell, String(amount), this.gen);
    this.renderTable();
    qs('#rouletteStatus', this.root).textContent = 'Chip liegt. Weitere legen oder drehen.';
  },
  undo() {
    if (this.spinning || !this.bets.length) return;
    const popped = this.bets.pop();
    const cell = this.cellFor(popped.type, popped.n);
    if (cell) { const tokens = qsa('.chip.placed', cell); if (tokens.length) tokens[tokens.length - 1].remove(); }
    SFX.play('click');
    this.renderTable();
  },
  clear() {
    if (this.spinning || !this.bets.length) return;
    this.bets = [];
    qsa('.chip.placed', this.root).forEach((c) => c.remove());
    SFX.play('click');
    this.renderTable();
  },
  repeat() {
    if (this.spinning || !this.lastBets.length) return;
    const ex = this.excluded();
    const bets = this.lastBets.filter((b) => !(b.type === 'number' && ex.includes(b.n)));
    if (!bets.length) {
      UI.toast({ icon: '🚫', title: 'Gesperrte Zahlen', tone: 'loss', text: 'Die alten Chips lägen auf gesperrten Zahlen.' });
      SFX.play('lose');
      return;
    }
    const lastTotal = Rules.rouletteTotal(bets);
    const chk = Rules.checkSpin(State.s, lastTotal, Perks.mods());
    if (!chk.ok) {
      UI.toast({ icon: '🚫', title: 'Zu wenig Geld', tone: 'loss', ms: 4500, text: `Wie zuletzt wären ${UI.fmt(lastTotal)} (+ Zinsen ${UI.fmt(chk.interest)} + Meds ${UI.fmt(chk.meds)}).` });
      SFX.play('lose');
      return;
    }
    qsa('.chip.placed', this.root).forEach((c) => c.remove());
    this.bets = bets.map((b) => Object.assign({}, b));
    for (const b of this.bets) { const cell = this.cellFor(b.type, b.n); if (cell) cell.append(h('div', { class: 'chip placed' }, String(b.amount))); }
    SFX.play('chip');
    this.renderTable();
  },
  async spin() {
    if (this.spinning || !this.root || !this.bets.length) return;
    const bets = this.bets.map((b) => Object.assign({}, b));
    const total = Rules.rouletteTotal(bets);
    if (!Game.beginSpin(total)) return;
    const run = Game.run;
    const gen = this.gen;
    this.spinning = true;
    this.renderTable();
    try {
      qs('#rtable', this.root).classList.add('locked');
      qsa('.chip.placed', this.root).forEach((c) => c.remove());
      const mods = Perks.mods();
      const ex = Rules.effectiveInsider(this.excluded().length > 0, total) ? this.excluded() : [];
      qs('#rouletteStatus', this.root).textContent = (this.excluded().length && !ex.length)
        ? `Über ${UI.fmt(Rules.INSIDER_CAP)} schaut der Croupier genauer hin – keine Hilfe.` : 'Kugel rollt…';
      qs('#resultNum', this.root).className = 'result-num';
      let rolled = Rules.rouletteRoll(Math.random, ex);
      const ti = Rules.rouletteLuckTarget(bets);
      if (ti >= 0) rolled = Rules.rouletteLuckOverride(bets[ti].type, bets[ti].n, rolled, Rules.effectiveLuck(Rules.luck(State.s, mods), bets[ti].amount), Math.random, ex);
      const targetIdx = Rules.WHEEL.indexOf(rolled);
      const sliceDeg = 360 / 37;
      const targetDeg = (360 - targetIdx * sliceDeg) % 360;
      const currentMod = this.wheelDeg % 360;
      let diff = targetDeg - currentMod;
      if (diff <= 0) diff += 360;
      this.wheelDeg += 5 * 360 + diff;
      this.drawWheel(-1);
      qs('#wheelCanvas', this.root).style.transform = `rotate(${this.wheelDeg}deg)`;
      this.animateBall(4000, gen);
      await wait(4100);
      const result = Rules.rouletteSettle(bets, rolled, mods);
      const delta = result.payout - total;
      this.lastBets = bets;
      if (this.gen === gen) this.bets = [];
      if (this.alive(gen)) {
        this.drawWheel(targetIdx);
        const res = qs('#resultNum', this.root);
        res.textContent = rolled;
        res.className = `result-num show ${rolled === 0 ? 'green' : Rules.isRed(rolled) ? 'red' : 'black'}`;
        const colName = rolled === 0 ? '🟢 0' : Rules.isRed(rolled) ? `🔴 ${rolled}` : `⚫ ${rolled}`;
        const label = (b) => b.type === 'number' ? String(b.n) : { red: 'Rot', black: 'Schwarz', even: 'Gerade', odd: 'Ungerade' }[b.type];
        const parts = result.hits.map((x) => x.win ? `${label(x.bet)} ✓ +${UI.fmt(x.payout - x.bet.amount)}` : `${label(x.bet)} ✗`);
        qs('#rouletteStatus', this.root).innerHTML = delta > 0
          ? `<span class="win">${colName} · ${parts.join(' · ')} → +${UI.fmt(delta)}</span>`
          : delta === 0 ? `<span>${colName} · ${parts.join(' · ')} → ±0</span>`
          : `<span class="loss">${colName} · ${parts.join(' · ')} → −${UI.fmt(-delta)}</span>`;
        this.bets = bets; this.renderTable(result); this.bets = [];   // Marker mit Gewinn/Verlust-Farbe stehen lassen
        setTimeout(() => { if (this.alive(gen)) this.renderTable(); }, 1400);
      }
      await Bus.emit('roulette:result', { bets, rolled, payout: result.payout, hits: result.hits, total, win: delta > 0 });
      await Game.settle(delta, { from: this.alive(gen) ? qs('.wheel-box', this.root) : null, game: 'roulette', bet: total, run });
    } finally {
      if (this.gen === gen) {
        this.spinning = false;
        qs('#rtable', this.root).classList.remove('locked');
        this.renderBar();
      }
    }
  },
};

UI.register('roulette', {
  template: 'tpl-roulette',
  mount(root) {
    Roulette.gen++;
    Roulette.root = root;
    Perks.refreshExcluded(); // Selbstheilung: ?screen=roulette oder „weiterspielen" landen sonst ohne die 12 Zahlen
    Roulette.buildTable();
    Roulette.drawWheel();
    qs('#wheelCanvas', root).style.transform = `rotate(${Roulette.wheelDeg}deg)`;
    Game.bindBet(root, 'rouletteBet', () => Math.max(1, Rules.maxBet(State.s, Perks.mods()) - Roulette.total()));
    Roulette.bets = [];
    qs('#btnSpin', root).addEventListener('click', () => Roulette.spin());
    qs('#btnUndo', root).addEventListener('click', () => Roulette.undo());
    qs('#btnClear', root).addEventListener('click', () => Roulette.clear());
    qs('#btnRepeat', root).addEventListener('click', () => Roulette.repeat());
    Roulette.renderTable();
  },
  unmount() {
    Roulette.gen++;
    if (Roulette.ballRaf) cancelAnimationFrame(Roulette.ballRaf);
    Roulette.ballRaf = null;
    Roulette.root = null;
    Roulette.spinning = false;
    Roulette.bets = [];
  },
});
</script>

<script id="game-horses">
/* ================= PFERDERENNEN ================= */
const Horses = {
  root: null, racing: false, loop: null, commentTimer: null, resolveRace: null, gen: 0, loser: null,
  alive(gen) { return !!this.root && this.gen === gen; },
  build() {
    const track = qs('#track', this.root);
    qsa('.lane', track).forEach((l) => l.remove());
    const picks = qs('#horsePicks', this.root);
    picks.innerHTML = '';
    for (const hrs of Rules.HORSES) {
      track.append(h('div', { class: 'lane' }, h('div', { class: 'gate' }),
        h('div', { class: 'runner', id: `h-${hrs.id}`, style: `--hc: ${hrs.col}` }, h('span', { class: 'horse' }, '🏇'), h('span', { class: 'tag' }, hrs.name))));
      picks.append(h('button', { class: 'pick' + (hrs.id === State.s.selectedHorse ? ' on' : ''), id: `pick-${hrs.id}`, style: `--hc: ${hrs.col}`, onclick: () => this.pick(hrs.id) },
        `${hrs.dot} ${hrs.name}`, h('small', {}, 'Quote 4.0')));
    }
  },
  pick(id) {
    if (this.racing) return;
    State.s.selectedHorse = id;
    State.save();
    qsa('.pick', this.root).forEach((p) => p.classList.toggle('on', p.id === `pick-${id}`));
    this.pickLoser();
    SFX.play('click');
  },
  pickLoser() {
    this.loser = Perks.mods().horseLoserMarked ? Rules.pickLoser(State.s.selectedHorse, Math.random) : null;
    qsa('.runner', this.root).forEach((r) => { const id = parseInt(r.id.slice(2), 10); const lame = id === this.loser; r.classList.toggle('lame', lame); qsa('.lame-tag', r).forEach((t) => t.remove()); if (lame) r.append(h('span', { class: 'lame-tag' }, '🚫 lahmt')); });
    const hint = qs('#horseInsider', this.root);
    if (hint) { hint.classList.toggle('hidden', this.loser === null); hint.textContent = this.loser !== null ? `🐴 Stallbursche: ${Rules.HORSES.find((x) => x.id === this.loser).name} gewinnt heute nicht (wirkt bis ${UI.fmt(Rules.INSIDER_CAP)} Einsatz)` : ''; }
  },
  comment(pos) {
    if (!this.root) return;
    const order = Rules.HORSES.map((hrs, i) => ({ hrs, p: pos[i] })).sort((a, b) => b.p - a.p);
    const lead = order[0], second = order[1], last = order[3];
    const gap = lead.p - second.p;
    const mine = lead.hrs.id === State.s.selectedHorse;
    const lines = gap < 10 ? [`Kopf an Kopf – ${lead.hrs.name} und ${second.hrs.name}!`, 'Das wird eng!']
      : gap > 40 ? [`${lead.hrs.name} zieht davon!`, `${lead.hrs.name} führt klar, ${last.hrs.name} hängt hinten.`]
        : [`${lead.hrs.name} vorn, ${second.hrs.name} dran.`, `${second.hrs.name} holt auf!`];
    if (mine) lines.push('Dein Pferd liegt vorn!');
    qs('#commentary', this.root).textContent = pick(lines);
  },
  dust(runner, x) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const lane = runner.parentElement;
    const d = h('span', { class: 'dust', style: `left:${runner.offsetLeft + x + 4}px; top:${runner.offsetTop + 34}px` });
    lane.append(d);
    setTimeout(() => d.remove(), 650);
  },
  async start() {
    if (this.racing || !this.root) return;
    const bet = Game.readBet('horseBet');
    if (!Game.beginSpin(bet)) return;
    const mods = Perks.mods();
    const marked = Rules.effectiveInsider(mods.horseLoserMarked, bet) ? this.loser : null;
    const run = Game.run;
    const gen = this.gen;
    this.racing = true;
    try {
      qs('#btnRace', this.root).disabled = true;
      qs('#horseStatus', this.root).textContent = (this.loser !== null && marked === null)
        ? `Über ${UI.fmt(Rules.INSIDER_CAP)} hält der Stallbursche den Mund.` : '';
      const track = qs('#track', this.root);
      const goal = track.clientWidth - 65;
      const pos = [0, 0, 0, 0];
      const luck = Rules.effectiveLuck(Rules.luck(State.s, mods), bet);
      const selected = State.s.selectedHorse;
      const runners = Rules.HORSES.map((hrs) => qs(`#h-${hrs.id}`, this.root));
      runners.forEach((r) => { r.style.transform = 'translateX(0)'; r.classList.add('running'); });
      SFX.play('whinny');
      SFX.loop('gallop', 260);
      this.commentTimer = setInterval(() => this.comment(pos), 600);
      let tick = 0;
      const winner = await new Promise((resolve) => {
        this.resolveRace = resolve;
        this.loop = setInterval(() => {
          if (!this.alive(gen)) { clearInterval(this.loop); this.resolveRace = null; resolve(null); return; }
          Rules.HORSES.forEach((hrs, i) => {
            pos[i] += Rules.horseStep(hrs.id === selected, luck, Math.random, hrs.id === marked ? Rules.HORSE_LAME_STEP : 1);
            runners[i].style.transform = `translateX(${pos[i]}px)`;
            if (tick % 4 === i) this.dust(runners[i], pos[i]);
          });
          tick++;
          const winIdx = Rules.raceWinner(pos, goal);
          if (winIdx >= 0) { clearInterval(this.loop); this.resolveRace = null; resolve(Rules.HORSES[winIdx]); }
        }, 30);
      });
      clearInterval(this.commentTimer);
      SFX.stop('gallop');
      if (!winner) { Game.forfeit(); return; } // Rennen abgebrochen (Screen verlassen) – Einsatz verfällt
      const won = winner.id === selected;
      /* Der 3,3:1-Bonus ist wie ein Insider-Deckel: er wirkt voll bis INSIDER_CAP, darüber anteilig weniger */
      const payoutMods = Object.assign({}, mods, { horsePayout: Rules.effectiveBonus(mods.horsePayout, Rules.NEUTRAL_MODS.horsePayout, bet) });
      const delta = Rules.horseDelta(won, bet, payoutMods);
      if (this.alive(gen)) {
        const flash = qs('#photoFlash', this.root);
        flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
        runners.forEach((r) => r.classList.remove('running'));
        const wr = qs(`#h-${winner.id}`, this.root);
        wr.classList.add('running');
        wr.style.transition = 'transform .7s ease-in';
        wr.style.transform = `translateX(${track.clientWidth + 40}px)`;
        setTimeout(() => { if (wr.isConnected) { wr.style.transition = ''; wr.classList.remove('running'); } }, 800);
        qs('#commentary', this.root).textContent = `${winner.name} gewinnt!`;
        qs('#horseStatus', this.root).innerHTML = won
          ? `<span class="win">${winner.name} siegt · +${UI.fmt(delta)}</span>`
          : `<span class="loss">${winner.name} siegt · −${UI.fmt(bet)}</span>`;
        qs('#btnRace', this.root).disabled = false;
      }
      await Bus.emit('horses:result', { winner: winner.id, selected, bet });
      await Game.settle(delta, { from: this.alive(gen) ? qs('#track', this.root) : null, game: 'horses', bet, run });
      if (this.alive(gen)) this.pickLoser();
    } finally {
      if (this.gen === gen) this.racing = false;
    }
  },
};

UI.register('horses', {
  template: 'tpl-horses',
  mount(root) {
    Horses.gen++;
    Horses.root = root;
    Horses.build();
    Horses.pickLoser();
    Game.bindBet(root, 'horseBet');
    qs('#btnRace', root).addEventListener('click', () => Horses.start());
  },
  unmount() {
    Horses.gen++;
    clearInterval(Horses.loop);
    clearInterval(Horses.commentTimer);
    if (Horses.resolveRace) {
      Horses.resolveRace(null); Horses.resolveRace = null;
      UI.toast({ icon: '🏇', title: 'Einsatz verfallen', text: 'Rennen ohne dich beendet.', tone: 'loss' });
    }
    SFX.stop('gallop');
    Horses.root = null;
    Horses.racing = false;
  },
});
</script>

<script id="game-russian">
/* ================= RUSSISCHES ROULETTE ================= */
const Russian = {
  root: null, duel: null, inDuel: false, busy: false, gen: 0,
  alive(gen) { return !!this.root && this.gen === gen; },
  drawCylinder() {
    const svg = qs('#cylinder', this.root);
    const ns = 'http://www.w3.org/2000/svg';
    svg.innerHTML = '';
    const el = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
    svg.append(el('circle', { cx: 100, cy: 100, r: 92, fill: '#2a2f36', stroke: '#8a94a0', 'stroke-width': 4 }));
    for (let i = 0; i < 6; i++) {
      const a = (-90 + i * 60) * Math.PI / 180;
      const c = el('circle', { cx: 100 + 56 * Math.cos(a), cy: 100 + 56 * Math.sin(a), r: 19, fill: '#0b0d10', stroke: '#8a94a0', 'stroke-width': 3, class: 'chamber', 'data-i': i });
      svg.append(c);
    }
    svg.append(el('circle', { cx: 100, cy: 100, r: 14, fill: '#8a94a0' }));
  },
  rotateTo(idx, gen) {
    if (!this.alive(gen)) return;
    const svg = qs('#cylinder', this.root);
    if (!svg) return;
    svg.style.transform = `rotate(${-60 * idx}deg)`;
    const box = svg.parentElement;
    box.classList.remove('zoom'); void box.offsetWidth; box.classList.add('zoom');
    qs('#chambersLeft', this.root).textContent = `${6 - idx} Kammer${6 - idx === 1 ? '' : 'n'}`;
  },
  markSpent(idx, gen) {
    if (!this.alive(gen)) return;
    const c = qs(`.chamber[data-i="${idx}"]`, this.root);
    if (c) { c.setAttribute('fill', '#3a3f46'); c.setAttribute('stroke', '#555'); }
    const left = 6 - (idx + 1);
    qs('#chambersLeft', this.root).textContent = `${left} Kammer${left === 1 ? '' : 'n'} übrig`;
  },
  setTurn(who) {
    if (!this.root) return;
    qs('#fPlayer', this.root).classList.toggle('turn', who === 'player');
    qs('#fIgor', this.root).classList.toggle('turn', who === 'igor');
  },
  heartbeat(duel) {
    if (!this.alive(duel.gen)) return;
    SFX.loop('heartbeat', Math.max(380, 900 - duel.idx * 110));
  },
  /* Duell ohne Abrechnung abbrechen (Screen verlassen) – Einsatz ist bereits abgezogen */
  drop(duel) {
    if (!duel || duel.done) return;
    duel.done = true;
    if (duel.forced) { Bus.emit('rr:forced', { victim: 'aborted' }); return; }
    Game.forfeit();
  },
  async start(opts = {}) {
    if (this.inDuel || !this.root) return;
    const forced = !!opts.forced;
    const bet = forced ? 0 : Game.readBet('rrBet');
    if (!forced && !Game.beginSpin(bet)) return;
    const gen = this.gen;
    const duel = { cylinder: Rules.rrCylinder(Math.random), idx: 0, bet, gen, run: forced ? null : Game.run, done: false, forced };
    this.duel = duel;
    this.inDuel = true;
    if (this.alive(gen)) {
      qs('#fPlayer', this.root).classList.remove('dead'); qs('#fIgor', this.root).classList.remove('dead');
      this.drawCylinder();
      qs('#cylinder', this.root).style.transform = 'rotate(0deg)';
      qs('#chambersLeft', this.root).textContent = '6 Kammern';
      qs('#rrBetControls', this.root).classList.add('hidden');
      qs('#rrActionControls', this.root).classList.remove('hidden');
    }
    if (!State.s.flags.igor) { State.s.flags.igor = true; State.save(); await Cutscene.play('igor.first', {}); }
    if (!this.alive(gen)) return;
    qs('#rrStatus', this.root).textContent = forced ? 'Vitos Prüfung. Kein Einsatz – nur dein Kopf. Drück ab.' : 'Du bist dran. Drück ab.';
    this.setTurn('player');
    this.heartbeat(duel);
  },
  async bang(who, gen) {
    if (this.alive(gen)) {
      const flash = qs('#rrFlash', this.root);
      flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
      SFX.stopAll(); SFX.play('gunshot');
      UI.shake(qs('#shell'));
      qs(who === 'player' ? '#fPlayer' : '#fIgor', this.root).classList.add('dead');
      qs(who === 'player' ? '#fPlayer .face' : '#fIgor .face', this.root).textContent = '💀';
    }
    await wait(600);
  },
  async pull() {
    if (!this.inDuel || this.busy || !this.root) return;
    const duel = this.duel;
    const gen = duel.gen;
    this.busy = true;
    try {
      if (this.alive(gen)) qs('#btnTrigger', this.root).disabled = true;
      this.rotateTo(duel.idx, gen);
      await wait(350);
      if (duel.cylinder[duel.idx]) {
        if (this.alive(gen)) qs('#rrStatus', this.root).innerHTML = duel.forced ? `<span class="loss">PÄNG · Streifschuss</span>` : `<span class="loss">PÄNG · Streifschuss · −${UI.fmt(duel.bet)} & 100 € Spital</span>`;
        await this.bang('player', gen);
        await this.end('player', duel);
        return;
      }
      if (this.alive(gen)) SFX.play('dryfire');
      this.markSpent(duel.idx, gen);
      duel.idx++;
      if (this.alive(gen)) { qs('#rrStatus', this.root).textContent = '*Klick*… Leer. Igor ist dran…'; this.setTurn('igor'); }
      this.heartbeat(duel);
      await wait(1100);
      this.rotateTo(duel.idx, gen);
      await wait(350);
      if (duel.cylinder[duel.idx]) {
        if (this.alive(gen)) qs('#rrStatus', this.root).innerHTML = duel.forced ? `<span class="win">PÄNG · Igor liegt</span>` : `<span class="win">PÄNG · Igor liegt · +${UI.fmt(duel.bet)}</span>`;
        await this.bang('igor', gen);
        await this.end('igor', duel);
        return;
      }
      if (this.alive(gen)) SFX.play('dryfire');
      this.markSpent(duel.idx, gen);
      duel.idx++;
      if (this.alive(gen)) {
        qs('#rrStatus', this.root).textContent = '*Klick*… Igor lebt. Du bist dran.';
        this.setTurn('player');
        qs('#btnTrigger', this.root).disabled = false;
      }
      this.heartbeat(duel);
      if (!this.alive(gen)) this.drop(duel); // Screen während des Zugs verlassen, Duell nicht entschieden
    } finally {
      if (this.gen === gen) this.busy = false;
    }
  },
  async end(victim, duel) {
    if (duel.done) return;
    duel.done = true;
    const gen = duel.gen;
    if (this.alive(gen)) SFX.stopAll(); else SFX.stop('heartbeat');
    try {
      if (this.alive(gen)) {
        this.setTurn(null);
        qs('#rrActionControls', this.root).classList.add('hidden');
        qs('#rrBetControls', this.root).classList.remove('hidden');
        qs('#btnTrigger', this.root).disabled = false;
      }
    } finally {
      if (this.gen === gen) { this.inDuel = false; this.busy = false; }
    }
    if (duel.forced) { await Bus.emit('rr:forced', { victim }); return; }
    const delta = Rules.rrDelta(victim, duel.bet);
    await Bus.emit('rr:result', { victim, bet: duel.bet });
    if (victim === 'player' && this.alive(gen)) await Cutscene.play('rr.headshot', {});
    await Game.settle(delta, { from: this.alive(gen) ? qs('.duel', this.root) : null, game: 'russian', bet: duel.bet, run: duel.run });
  },
};

UI.register('russian', {
  template: 'tpl-russian',
  mount(root) {
    Russian.gen++;
    Russian.root = root;
    Russian.drawCylinder();
    Game.bindBet(root, 'rrBet');
    qs('#btnDuel', root).addEventListener('click', () => Russian.start());
    qs('#btnTrigger', root).addEventListener('click', () => Russian.pull());
  },
  unmount() {
    Russian.gen++;
    SFX.stop('heartbeat');
    if (Russian.inDuel) {
      /* Zwischen zwei Zügen verlassen: Duell sofort abbrechen. Läuft noch ein Zug (busy), räumt der selbst auf bzw. rechnet ab. */
      const wasForced = Russian.duel && Russian.duel.forced;
      if (!Russian.busy) Russian.drop(Russian.duel);
      if (!wasForced) UI.toast({ icon: '🔫', title: 'Duell abgebrochen', text: 'Einsatz verfallen.', tone: 'loss' });
    }
    Russian.root = null;
    Russian.inDuel = false;
    Russian.busy = false;
  },
});

Cutscene.define('igor.first', () => [
  { bg: 'keller', who: 'igor', mood: 'calm', text: '…' },
  ...(State.s.strength >= Rules.MUG.STR_RESPECT ? [{ bg: 'keller', who: 'igor', mood: 'happy', text: 'Respekt. Man hört Dinge. Mein Cousin humpelt noch.' }] : []),
  { bg: 'keller', who: 'igor', mood: 'calm', text: 'Eine Kugel. Sechs Kammern. Du zuerst. Ich habe Zeit.' },
]);
Cutscene.define('rr.headshot', [
  { bg: 'klinik', who: 'doc', mood: 'shock', fx: 'flash', text: 'Streifschuss! Du Glückspilz. Hundert Euro fürs Pflaster – und für meine Nerven.' },
]);
</script>

<script id="game-postman">
/* ================= POST AUSTRAGEN ================= */
const Postman = {
  root: null, streak: 0, timer: null, timeLeft: 0, target: null, tier: null, active: false, busy: false, gen: 0,
  alive(gen) { return !!this.root && this.gen === gen; },
  renderHouses() {
    const box = qs('#houses', this.root);
    box.innerHTML = '';
    for (const hs of [...Rules.POST_HOUSES].sort(() => Math.random() - 0.5)) {
      box.append(h('button', { class: 'house', 'data-n': hs.n, style: `--hc: ${hs.c}`, onclick: () => this.deliver(hs.n) },
        h('div', { class: 'roof' }), h('div', { class: 'wall' }, `#${hs.n}`), h('div', { class: 'mailbox' }, '📫', h('div', { class: 'flag' }))));
    }
  },
  startShift() {
    if (this.active || !this.root) return;
    const gen = this.gen;
    this.active = true; this.streak = 0;
    qs('#btnShift', this.root).classList.add('hidden');
    qs('#fuseWrap', this.root).classList.remove('hidden');
    qs('#letter', this.root).classList.remove('hidden');
    qs('#jobStatus', this.root).textContent = '';
    this.nextStep(gen);
  },
  nextStep(gen) {
    clearInterval(this.timer);
    if (!this.alive(gen)) return;
    const mods = Perks.mods();
    if (this.streak >= mods.postLetters) { this.endShift(`Feierabend! ${mods.postLetters} Briefe ausgetragen.`); return; }
    const prevTier = this.tier;
    this.tier = Rules.postmanTier(this.streak, State.s, mods);
    if (prevTier && prevTier.t !== this.tier.t) this.stamp();
    this.timeLeft = this.tier.t;
    this.target = pick(Rules.POST_HOUSES);
    qs('#letter', this.root).innerHTML = `An: <b style="color:${this.target.c}">Haus #${this.target.n}</b><br>${this.tier.r} € Lohn`;
    qs('#streak', this.root).innerHTML = `${this.streak}<span> in Folge</span>`;
    this.renderHouses();
    const fuse = qs('#fuse', this.root), spark = qs('#spark', this.root);
    fuse.style.width = '100%'; spark.style.left = '100%';
    this.timer = setInterval(() => {
      if (!this.alive(gen)) { clearInterval(this.timer); return; }
      this.timeLeft -= 0.05;
      const pct = Math.max(0, (this.timeLeft / this.tier.t) * 100);
      fuse.style.width = pct + '%'; spark.style.left = pct + '%';
      if (this.timeLeft <= 0) { clearInterval(this.timer); this.fail('Zu langsam!', null, gen); }
    }, 50);
  },
  stamp() {
    const st = qs('#stamp', this.root);
    st.classList.remove('hidden'); st.style.animation = 'none'; void st.offsetWidth; st.style.animation = '';
    SFX.play('stamp');
    setTimeout(() => st.classList.add('hidden'), 900);
  },
  async deliver(n) {
    if (!this.active || !this.root || this.busy) return;
    const gen = this.gen;
    this.busy = true;
    try {
      clearInterval(this.timer);
      const house = qs(`.house[data-n="${n}"]`, this.root);
      if (n === this.target.n) {
        const reward = this.tier.r;
        house.classList.add('delivered');
        const from = qs('#letter', this.root).getBoundingClientRect(), to = qs('.mailbox', house).getBoundingClientRect(), st = qs('#street', this.root).getBoundingClientRect();
        const env = h('span', { class: 'envelope', style: `left:${from.left - st.left}px; top:${from.top - st.top}px` }, '✉️');
        qs('#street', this.root).append(env);
        void env.offsetWidth;
        env.style.transform = `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(.5)`; env.style.opacity = '0';
        setTimeout(() => env.remove(), 400);
        SFX.play('coin');
        Game.applyDelta(reward, { from: house });
        this.streak++;
        if (this.streak > State.s.stats.postStreakBest) { State.s.stats.postStreakBest = this.streak; State.save(); }
        qs('#jobStatus', this.root).innerHTML = `<span class="win">+${UI.fmt(reward)}</span>`;
        await Bus.emit('post:streak', { streak: this.streak });
        await wait(250);
        if (!this.alive(gen)) return;
        this.nextStep(gen);
      } else {
        this.fail('Falscher Kasten!', house, gen);
      }
    } finally {
      if (this.gen === gen) this.busy = false;
    }
  },
  fail(msg, house, gen) {
    clearInterval(this.timer);
    if (this.gen === gen) this.active = false;
    if (!this.alive(gen)) return;
    const target = house || qs(`.house[data-n="${this.target.n}"]`, this.root);
    if (target) { target.append(h('span', { class: 'dog' }, '🐕')); }
    SFX.play('dog');
    UI.shake(qs('#street', this.root));
    Game.applyDelta(-Rules.POST_PENALTY, { from: target });
    qs('#fuseWrap', this.root).classList.add('hidden');
    qs('#letter', this.root).classList.add('hidden');
    qs('#jobStatus', this.root).innerHTML = `<span class="loss">${msg} 25 € Strafe. Schicht beendet nach ${this.streak} Briefen.</span>`;
    qs('#btnShift', this.root).classList.remove('hidden');
    this.tier = null;
    if (State.mode === 'story') Jobs.finishGame('post');
    if (Rules.isGameOver(State.s, Perks.mods())) Bus.emit('gameover', {});
  },
  endShift(msg) {
    clearInterval(this.timer);
    this.active = false;
    if (this.root) {
      qs('#fuseWrap', this.root).classList.add('hidden');
      qs('#letter', this.root).classList.add('hidden');
      qs('#jobStatus', this.root).innerHTML = `<span class="win">${msg}</span>`;
      qs('#btnShift', this.root).classList.remove('hidden');
    }
    this.tier = null;
    if (State.mode === 'story') Jobs.finishGame('post');
  },
};

UI.register('postman', {
  template: 'tpl-postman',
  mount(root) {
    Postman.gen++;
    Postman.root = root;
    Postman.streak = 0; Postman.active = false; Postman.tier = null;
    Postman.renderHouses();
    qs('#btnShift', root).addEventListener('click', () => Postman.startShift());
  },
  unmount() {
    if (State.mode === 'story' && Postman.active) Jobs.abort();
    Postman.gen++;
    clearInterval(Postman.timer);
    Postman.root = null;
    Postman.active = false;
    Postman.busy = false;
  },
});
</script>

    let sepDone = false;

      grid.append(h('div', { class: 'trophy' + (this.has(d.id) ? ' on' : ''), 'data-id': d.id, title: d.desc }, h('span', { class: 't-ic' }, d.icon), h('span', {}, d.title)));
    }
  },
};

Bus.on('mafia.repaid', () => Achievements.unlock('vitosFriend'));

Bus.on('story:ended', ({ id, ending }) => {
  const st = typeof Stories !== 'undefined' ? Stories.get(id) : null;
  const map = Object.assign({ ehrlich: 'endeEhrlich', taxi: 'endeTaxi', sturz: 'endeSturz' }, st && st.trophies);
  if (map[ending]) Achievements.unlock(map[ending]);

  const total = st ? st.endings.length : 4;
  if (run && run.endings.length >= total) Achievements.unlock('alleEnden');
});

<script id="gameover">
/* ================= GAME OVER & NEUES SPIEL ================= */
Cutscene.define('gameover', [
  { bg: 'hafen-morgen', who: 'vito', mood: 'calm', text: 'Schöner Sonnenaufgang, oder? Ich komme gern hierher, wenn ich nachdenken muss. Über Freunde. Über Schulden.' },
  { bg: 'hafen-morgen', who: 'vito', mood: 'calm', text: 'Die Bank will nichts mehr von dir, ich habe schon etwas von dir, und dein Konto steht bei {{balance}}. Das nennt man ein Ende.' },
  { bg: 'hafen-morgen', who: 'vito', mood: 'happy', fx: 'stats', text: 'Aber ich bin kein Unmensch. Fünfzig Euro und ein neuer Anfang. Wir sehen uns unten.',
    choices: [{ label: 'Nochmal', value: 'again', cls: 'red' }] },
]);

async function restartGame({ playIntro }) {
  State.reset();
  State.s.flags.intro = true;
  State.save();
  if (typeof Perks !== 'undefined') Perks.refreshExcluded(true);
  Roulette.lastBets = [];
  UI.setBalance(State.s.balance, { animate: false });
  UI.renderWallet();
  UI.renderSide();
  await UI.show('hub');
  if (playIntro) await Cutscene.play('intro');
}

let gameOverPending = false;
Bus.on('gameover', async () => {
  if (State.mode === 'story') return;
  if (gameOverPending) return;
  gameOverPending = true;
  const s = State.s;
  const stats = {
    Spins: s.stats.spins,
    'Höchster Kontostand': UI.fmt(s.stats.maxBalance),
    'Größter Gewinn': UI.fmt(s.stats.biggestWin),
    'Verkaufte Nieren': s.stats.kidneys,
    'Beste Post-Serie': s.stats.postStreakBest,
    'Game Overs': State.meta.gameOvers + 1,
  };
  SFX.stopAll();
  await Cutscene.play('gameover', { balance: UI.fmt(s.balance), stats });
  State.meta.gameOvers++;
  State.saveMeta();
  try {
    await restartGame({ playIntro: false });
  } finally {
    gameOverPending = false;
  }
  UI.toast({ icon: '🌅', title: 'Neuer Anfang', text: '50 € und ein Kater. Auf geht’s.', tone: 'gold' });
  await Bus.emit('gameover:restart', {});
});

Bus.on('newgame.request', async () => {
  if (Cutscene.active) return;
  if (Game.inFlight > 0) { UI.toast({ icon: '⏳', title: 'Erst die Runde beenden', text: 'Ein Spiel läuft noch.', tone: 'loss' }); return; }
  if (State.mode === 'story') return Story.enter('newstory');
  const c = await Cutscene.play('newgame.confirm', {});
  if (c !== 'yes') return;
  await restartGame({ playIntro: true });
});
</script>

<script id="mugging">
/* ================= ÜBERFALL – auf dem Weg in den Keller ================= */
const Mugging = {
  force: null,     // Dev-Parameter ?mug=1|junkie|jugend|cousin – erzwingt den nächsten Überfall
  running: false,
  CASINO: ['roulette', 'slots', 'horses', 'russian', 'blackjack'],
  TYPES: {
    junkie: {
      name: 'Der Junkie', emoji: '🧟',
      intro: ['Ey. EY. Hast du mal… {{loot}}? Ich hab ein Messer. Glaub ich. Irgendwo.', 'Seine Hand zittert. Das Messer nicht. Doch, das auch.'],
      fightWon: 'Ein Schubser. Er sitzt im Müll und weint. Du fühlst dich nicht gut dabei, aber stärker.',
      fightLost: 'Er trifft dich mit irgendwas Hartem. Als du hochkommst, ist er weg. Dein Geld auch.',
      fled: 'Du rennst. Er rennt auch – in die andere Richtung. Keiner weiß warum.',
      caught: 'Du stolperst. Er nicht. Er nimmt {{loot}} und, weil er sauer ist, noch {{extra}} dazu.',
      paid: 'Er nimmt die Scheine, murmelt „danke, Bruder" und ist weg.',
    },
    jugend: {
      name: 'Zwei Jugendliche', emoji: '🧢',
      intro: ['„Handy, Geld, Jacke. Los." Der Kleinere filmt.', 'Der Größere hat einen Schlagring. Der Kleinere hat 40.000 Follower.'],
      fightWon: 'Der Schlagring landet im Gully, der Größere auf dem Boden, das Video im Netz. Du siehst gut aus darauf.',
      fightLost: 'Zu zweit. Du kommst nicht mal zum Schwingen. {{loot}} weg – und das Video hat schon 200 Likes.',
      fled: 'Du bist schneller als beide. Der Kleinere filmt noch deinen Rücken.',
      caught: 'Der Kleinere stellt dir ein Bein. {{loot}} und {{extra}} extra, „fürs Wegrennen".',
      paid: '„Klug." Sie nehmen {{loot}} und machen ein Selfie mit dir.',
    },
    cousin: {
      name: 'Igors Cousin', emoji: '🐻',
      intro: ['„Igor sagt, du hast Geld. Igor sagt auch, du bist Freund. Ich bin nicht Igor."', 'Er ist größer als Igor. Das sollte nicht möglich sein.'],
      fightWon: 'Du triffst ihn genau einmal. Es reicht. Er nickt anerkennend, bevor er umfällt.',
      fightLost: 'Er hebt dich hoch wie einen Sack Mehl und schüttelt {{loot}} aus dir raus.',
      fled: 'Er kommt nicht mal aus dem Stand. „Nächstes Mal", ruft er. Klingt fast freundlich.',
      caught: 'Zwei Schritte. Er hat dich am Kragen. {{loot}} plus {{extra}} „für Laufen".',
      paid: '„Igor hatte recht. Du bist vernünftig." {{loot}} wechseln den Besitzer.',
    },
  },
  blocked() {
    if (Cutscene.active || Game.inFlight > 0 || gameOverPending || this.running) return true;
    if (typeof Story !== 'undefined' && Story.sleeping) return true;
    return false;
  },
  /* Gibt true zurück, wenn ein Überfall gelaufen ist. Aufrufer wartet, bevor er weitermacht. */
  async maybe(where) {
    if (this.blocked()) return false;
    const s = State.s;
    const forced = this.force;
    const chance = forced ? 1 : Rules.mugChance(s, where, Perks.mods());
    if (Math.random() >= chance) return false;
    this.force = null;
    this.running = true;
    try {
      const typeId = typeof forced === 'string' && this.TYPES[forced] ? forced : pick(Object.keys(this.TYPES));
      await this.run(typeId);
    } finally { this.running = false; }
    return true;
  },
  async run(typeId) {
    const s = State.s;
    const mods = Perks.mods();
    const T = this.TYPES[typeId];
    const loot = Rules.mugLoot(s.balance);
    const gear = Rules.gear(s);
    const ctx = { loot: UI.fmt(loot), type: T, fight: Math.round(Rules.fightChance(s.strength, mods) * 100), flee: Math.round(Rules.fleeChance(gear) * 100) };
    const choice = await Cutscene.play('mug.intro', ctx);
    let outcome, delta = 0, wallet = 0;
    if (choice === 'fight') {
      const won = Math.random() < Rules.fightChance(s.strength, mods);
      if (won) {
        outcome = 'fightWon';
        if (s.strength >= Rules.MUG.STR_WALLET) wallet = Rules.mugWallet(Math.random, mods);
        delta = wallet;
        s.stats.fightsWon++;
      } else { outcome = 'fightLost'; delta = -loot; }
      s.strength++;
    } else if (choice === 'flee') {
      if (Math.random() < Rules.fleeChance(gear)) outcome = 'fled';
      else { outcome = 'caught'; delta = -Math.min(s.balance, loot + Rules.fleeFailExtra(s.balance)); }
    } else { outcome = 'paid'; delta = -loot; }
    s.stats.muggings++;
    s.mugCooldown = State.mode === 'story' ? Rules.MUG.COOLDOWN_DAYS : Rules.MUG.COOLDOWN_SPINS;
    if (delta !== 0) Game.applyDelta(delta, { quiet: true });
    State.save();
    await Cutscene.play('mug.' + outcome, Object.assign({}, ctx, { extra: UI.fmt(Math.max(0, -delta - loot)), wallet: UI.fmt(wallet), strength: s.strength }));
    if (outcome === 'fightWon' || outcome === 'fightLost') UI.toast({ icon: '💪', title: `Stärke ${s.strength}`, text: outcome === 'fightWon' ? 'Gewonnen. Du wirst härter.' : 'Verloren. Du wirst trotzdem härter.', tone: outcome === 'fightWon' ? 'win' : 'loss' });
    UI.renderWallet(); UI.renderSide();
    await Bus.emit('mug:done', { outcome, loot, strength: s.strength });
  },
};
