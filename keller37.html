<script id="selftest">
/* ================= SELFTEST – läuft mit ?selftest im Browser und via node tests/run-selftest.mjs ================= */
const SelfTest = {
  cases: [],
  test(name, fn) { this.cases.push({ name, fn }); },
  eq(a, b, msg = '') {
    const ja = JSON.stringify(a), jb = JSON.stringify(b);
    if (ja !== jb) throw new Error(`${msg} erwartet ${jb}, bekommen ${ja}`);
  },
  ok(v, msg = 'erwartet wahr') { if (!v) throw new Error(msg); },
  throws(fn, msg = '') { let threw = false; try { fn(); } catch (e) { threw = true; } if (!threw) throw new Error(`${msg} – kein Fehler geworfen`); },
  /* async: Tests dürfen ein Promise zurückgeben (Browser-Tests der Story-Engine); synchrone Tests laufen wie bisher */
  async run() {
    let passed = 0, failed = 0; const failures = [];
    for (const c of this.cases) {
      try { await c.fn(); passed++; } catch (e) { failed++; failures.push(`${c.name}: ${e.message}`); }
    }
    return { passed, failed, failures };
  },
};
/* deterministischer rng: liefert die Werte der Reihe nach, dann von vorn */
const seq = (...vals) => { let i = 0; return () => vals[i++ % vals.length]; };
/* deterministischer rng mit Seed (Mulberry32) – für Simulationen */
const seeded = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const T = SelfTest;

/* ---- Rules: Wirtschaft ---- */
const base = (o = {}) => Object.assign({
  balance: 50, beers: 0, beerTimer: 0, brownieTimer: 0, kidneySold: false,
  bankDebt: 0, mafiaDebt: 0, hasHouse: false, hasDealer: false,
  isMarried: false, isHeartbroken: false,
}, o);

T.test('luck: nichts aktiv = 0', () => T.eq(Rules.luck(base()), 0));
T.test('luck: 1/2/3 Bier = 10/15/20', () => {
  T.eq(Rules.luck(base({ beers: 1, beerTimer: 2 })), 10);
  T.eq(Rules.luck(base({ beers: 2, beerTimer: 1 })), 15);
  T.eq(Rules.luck(base({ beers: 3, beerTimer: 2 })), 20);
});
T.test('luck: Bier ohne Timer zählt nicht', () => T.eq(Rules.luck(base({ beers: 2, beerTimer: 0 })), 0));
T.test('luck: Brownie +40, mit 3 Bier 60', () => {
  T.eq(Rules.luck(base({ brownieTimer: 1 })), 40);
  T.eq(Rules.luck(base({ beers: 3, beerTimer: 2, brownieTimer: 1 })), 60);
});
T.test('Rules.luck: Story-Modifikator, darf unter 0 fallen', () => {
  T.eq(Rules.luck(base({ beers: 3, beerTimer: 2, story: { luckMod: -15 } })), 5);
  T.eq(Rules.luck(base({ beers: 1, beerTimer: 2, story: { luckMod: -15 } })), -5);
  T.eq(Rules.luck(base({ story: { luckMod: 10 } })), 10);
  T.eq(Rules.luck(base({ story: {} })), 0);
});
T.test('luck: Story-Modifikator kann negativ werden (Pech)', () => {
  T.eq(Rules.luck(base({ story: { luckMod: -15 } })), -15);
  T.eq(Rules.luck(base({ beers: 3, beerTimer: 2, story: { luckMod: -15 } })), 5);
  T.eq(Rules.luck(base({ beers: 1, beerTimer: 2, story: { luckMod: -15 } })), -5);
});
T.test('effectiveLuck: Pech wird wie Glück gedeckelt', () => { T.eq(Rules.effectiveLuck(-60, 200), -30); T.eq(Rules.effectiveLuck(-15, 50), -15); });
T.test('pech: nur bei negativem Glück, Wahrscheinlichkeit |luck| %', () => {
  let calls = 0; const counting = () => { calls++; return 0; };
  T.eq(Rules.pech(20, counting), false); T.eq(Rules.pech(0, counting), false); T.eq(calls, 0, 'bei luck ≥ 0 kein rng-Aufruf');
  T.eq(Rules.pech(-15, seq(0.14)), true); T.eq(Rules.pech(-15, seq(0.15)), false); T.eq(Rules.pech(-100, seq(0.999)), true);
});
T.test('bankInterest: 8 % gerundet', () => {
  T.eq(Rules.bankInterest(0), 0);
  T.eq(Rules.bankInterest(200), 16);
  T.eq(Rules.bankInterest(1000), 80);
  T.eq(Rules.bankInterest(333), 27);

});

  const seen = [];

  Bus.emit('t1', { x: 2 });

  Bus.emit('t1', { x: 3 });

});
T.test('Bus.emit: werfender Handler stoppt andere Handler nicht, liefert Promise', () => {
  const seen = [];
  Bus.on('t2', () => { throw new Error('boom'); });
  Bus.on('t2', (p) => { seen.push(p.x); });
  const r = Bus.emit('t2', { x: 1 });
  T.eq(seen, [1]);
  T.ok(r instanceof Promise);
});

T.test('Mega Seven: RTP-Korridor (60.000 Spins, Seed 7)', () => {
  const rng = seeded(7); let paid = 0, ret = 0, free = 0;
  for (let i = 0; i < 60000; i++) {
    const isFree = free > 0; if (isFree) free--; else paid += 500;
    const w = RoyalRules.megaWin(RoyalRules.megaRoll(rng), 500, isFree);
    ret += w.payout; if (w.freeSpins) free = Math.min(RoyalRules.MEGA.FREE_MAX, free + w.freeSpins);
  }
  const rtp = ret / paid;
  T.ok(rtp > 0.88 && rtp < 0.98, `RTP ${rtp.toFixed(3)} außerhalb 0,88–0,98`);
});

const KATER_JOBS = ['spueler', 'post', 'taxi', 'tuersteher', 'croupier', 'eintreiber', 'filialleiter'];
const katerState = (o = {}, prev = { schuld: 'ehrlich' }) => {
  const s = Object.assign(base({ balance: 2000, car: 'mercC', hasHouse: true, flags: {} }), { story: StoryRules.freshStoryPart(STORY_KATER, { schuld: { lastPlayed: 1, endings: [prev.schuld], last: prev.schuld } }) }, o);
  return s;
};
/* Events eines Hooks wie die Engine anwenden (Szenen ohne Wahl), gibt die Event-IDs zurück */
const runHook = (s, at) => {
  const ids = [];
  for (const e of StoryRules.dueEvents(STORY_KATER, s, at)) {
    ids.push(e.id);
    for (const eff of e.effects || []) StoryRules.applyEffect(s, eff, STORY_KATER);
    if (e.once) s.story.seen.push(e.id);
    if (e.daily) (s.story.seenDay || (s.story.seenDay = {}))[e.id] = s.story.day;
  }
  return ids;
};

    const keep = { mode: State.mode, s: State.s, save: State.save, saveMeta: State.saveMeta, story: Story.story, finish: Story.finish, fade: Story.fade };
    let finished = null;

      State.s = sA; Story.story = a;

<script id="boot">
/* ================= BOOT ================= */
(async function boot() {
  const params = new URLSearchParams(location.search);
  let storage;
  try { storage = window.localStorage; storage.getItem('x'); } catch (e) {
    storage = { data: {}, getItem(k) { return k in this.data ? this.data[k] : null; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } };
  }
  if (params.has('fresh')) { try { storage.removeItem('keller37.state'); storage.removeItem('keller37.story'); } catch (e) { /* egal */ } }
  if (params.has('mug')) Mugging.force = params.get('mug') === '1' || params.get('mug') === '' ? true : params.get('mug');
  const { loaded, discarded } = State.init(storage);
  Modes.freeLoaded = loaded;
  UI.mountShell();
  if (discarded) UI.toast({ icon: '🗑️', title: 'Alter Spielstand verworfen', text: 'Unlesbar oder falsche Version – neues Spiel.', tone: 'loss', ms: 5000 });
  if (params.has('selftest')) {
    const r = await SelfTest.run();
    document.documentElement.dataset.selftest = `passed=${r.passed} failed=${r.failed}`;
    console.log('[selftest]', r);
    r.failures.forEach((f) => console.error('[selftest] FAIL', f));
    UI.toast({ icon: r.failed ? '❌' : '✅', title: 'Selbsttest', text: `${r.passed} bestanden, ${r.failed} fehlgeschlagen`, tone: r.failed ? 'loss' : 'win', ms: 6000 });
  }
  const wantsStory = params.has('story') || params.get('mode') === 'story' || params.has('job');
  const skipTitle = params.has('mode') || params.has('story') || params.has('screen') || params.has('scene') || params.has('selftest') || params.has('job');
  if (wantsStory) { await Modes.enter(State.hasStoryRun() && !params.has('fresh') ? 'story' : 'newstory'); return; }
  if (!skipTitle) { const choice = await Title.show(); await Modes.enter(choice); return; }
  /* Dev-Pfad freies Spiel: wie bisher */
  document.body.classList.add('mode-free');
  if (params.has('shop') && typeof Stadt !== 'undefined') Stadt.shop = Stadt.SHOPS[params.get('shop')] ? params.get('shop') : null;
  if (params.get('screen') === 'royal' && params.has('game') && ['megaslots', 'craps', 'wheel'].includes(params.get('game'))) { await UI.show(params.get('game')); }
  else await UI.show(params.get('screen') || 'hub');
  let gameOverAtBoot = false;
  if (Rules.isGameOver(State.s, Perks.mods())) { gameOverAtBoot = true; await Bus.emit('gameover', {}); }
  if (params.has('scene')) {
    await Cutscene.play(params.get('scene'), { bill: 900, before: 1000, after: 500, price: '1.000 €', debt: 300, stats: { Spins: 12, 'Höchster Kontostand': '1.234 €' } });
  } else if (!State.s.flags.intro && !params.has('screen')) {
    await Cutscene.play('intro');
    State.s.flags.intro = true;
    State.save();
  }
  if (loaded && !gameOverAtBoot && !params.has('screen')) UI.toast({ icon: '💾', title: 'Spielstand geladen', text: `Willkommen zurück. ${UI.fmt(State.s.balance)} in der Tasche.` });
  Modes.freeLoaded = false;
})();
</script>
</body>
</html>
